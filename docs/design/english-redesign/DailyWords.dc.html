<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Token do truc tiep tu reference.png (xem docs/design/english-redesign/TOKENS.md) */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, "Segoe UI", system-ui, sans-serif; background: #020810; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
    a { color: #6FA8FF; } a:hover { color: #9CC5FF; }
    .h { font-family: "Space Grotesk", Manrope, system-ui, sans-serif; letter-spacing: -0.4px; }
    .eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: #9EB4CC; text-transform: uppercase; }
    /* Nen widget: sang o tren-trai, loang dan xuong toi. Vien tren sang, vien duoi TOI HON nen. */
    .card { border-radius: 18px;
      /* do tu anh goc: long the PHANG #0D1622 tren nen #02070F -> rgba(130,178,240,0.085) */
      background: rgba(130,178,240,0.085);
      border: 1px solid rgba(200,224,255,0.14);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.11); }
    .tile { border-radius: 13px;
      background: rgba(130,178,240,0.105);
      border: 1px solid rgba(200,224,255,0.12);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.09); }
    /* Chip icon: quang sang tron, KHONG vien */
    .chip { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      /* do tu anh goc: dem sang dat L45 tren nen the L21, co mep dia hoi ro */
      background: radial-gradient(circle at 50% 47%, rgba(194,222,255,0.185) 0%, rgba(184,212,252,0.165) 56%, rgba(168,202,248,0.125) 76%, rgba(150,188,240,0.035) 93%, rgba(140,180,236,0) 100%);
      box-shadow: inset 0 0 0 1px rgba(206,228,255,0.10); }
    .sub { font-size: 9px; font-weight: 500; color: #9BB9DA; }
    @keyframes wave { 0%, 100% { transform: scaleY(0.30); opacity: 0.45; } 50% { transform: scaleY(1); opacity: 0.95; } }
    .wv { width: 2px; border-radius: 999px; background: linear-gradient(180deg, rgba(120,175,255,0.85), rgba(74,144,255,0.25)); transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #020810;">

  <!-- Nen trang: #050C15 tren -> #020810 giua -> #01050D duoi (do tu anh goc) -->
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #071020 0%, #030A15 20%, #01060D 50%, #000409 76%, #000206 100%);"></div>

  <!-- Than + vanh sang hanh tinh goc tren-phai -->
  <div style="position: absolute; top: 0; left: 0; width: 900px; height: 900px; pointer-events: none;">
    <svg width="900" height="900" viewBox="0 0 900 900" fill="none">
      <defs>
        <radialGradient id="haze" gradientUnits="userSpaceOnUse" cx="352" cy="74" r="300">
          <stop offset="0%" stop-color="rgba(112,172,255,0.26)"/>
          <stop offset="44%" stop-color="rgba(70,124,226,0.10)"/>
          <stop offset="100%" stop-color="rgba(40,78,168,0)"/>
        </radialGradient>
        <linearGradient id="limb" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(158,205,255,0)"/>
          <stop offset="34%" stop-color="rgba(170,212,255,0.05)"/>
          <stop offset="60%" stop-color="rgba(214,236,255,0.55)"/>
          <stop offset="80%" stop-color="rgba(255,255,255,0.98)"/>
          <stop offset="100%" stop-color="rgba(180,216,255,0.46)"/>
        </linearGradient>
        <linearGradient id="limbSoft" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(120,172,255,0)"/>
          <stop offset="40%" stop-color="rgba(130,180,255,0.02)"/>
          <stop offset="68%" stop-color="rgba(158,202,255,0.26)"/>
          <stop offset="86%" stop-color="rgba(180,218,255,0.46)"/>
          <stop offset="100%" stop-color="rgba(150,196,255,0.20)"/>
        </linearGradient>
        <filter id="bWide" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="bMid" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3.4"/></filter>
        <filter id="bCore" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.0"/></filter>
      </defs>
      <circle cx="352" cy="74" r="300" fill="url(#haze)"/>
      <!-- Vanh sang = 3 lop nhoe chong nhau -> chi thay SANG DAM LEN, khong thay duong vien -->
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="34" opacity="0.62" filter="url(#bWide)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="10" filter="url(#bMid)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limb)" stroke-width="2.2" filter="url(#bCore)"/>
    </svg>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; pointer-events: none; background: linear-gradient(180deg, rgba(1,5,12,0) 0%, rgba(1,5,12,0.45) 52%, rgba(1,5,12,0.85) 100%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; padding: 14px 14px 0;">

    <!-- Popup header -->
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <div class="h" style="font-size: 17.5px; font-weight: 700;">Learn 12 words today</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #9BB9DA;">3/12 words learned today</div>
      </div>
    </div>

    <!-- Progress bar -->
    <div style="height: 5px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; margin-bottom: 18px;">
      <div style="height: 100%; width: 25%; border-radius: 999px; background: linear-gradient(90deg, #4A90FF, #7FC0FF);"></div>
    </div>

    <!-- Word chips -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); margin-bottom: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span class="h" style="font-size: 12.5px; font-weight: 700;">Word list</span>
        <span style="font-size: 10px; font-weight: 600; color: #93AECE;">12 words</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(74,144,255,0.13); border: 1px solid rgba(74,144,255,0.32);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.6l4.6 4.6 9.8-10.4"/></svg>
          <span style="font-size: 11.5px; font-weight: 600;">confident</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(74,144,255,0.13); border: 1px solid rgba(74,144,255,0.32);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.6l4.6 4.6 9.8-10.4"/></svg>
          <span style="font-size: 11.5px; font-weight: 600;">journey</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(74,144,255,0.13); border: 1px solid rgba(74,144,255,0.32);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.6l4.6 4.6 9.8-10.4"/></svg>
          <span style="font-size: 11.5px; font-weight: 600;">remind</span>
        </div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">shelter</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">gentle</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">approach</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">whisper</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">borrow</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">steady</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">delight</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">glance</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);"><span style="font-size: 11.5px; font-weight: 600; color: #A7C3E2;">arrange</span></div>
      </div>
    </div>

    <!-- Reminder interval -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); margin-bottom: 12px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.8"/></svg>
      <span style="flex-grow: 1; font-size: 12px; font-weight: 600;">Quiz reminder every</span>
      <div style="display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);">
        <span style="font-size: 11.5px; font-weight: 700;">30 min</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(200,218,246,0.5)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <!-- Review mode -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); margin-bottom: 16px;">
      <span class="h" style="font-size: 12.5px; font-weight: 700;">Review method</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px; border-radius: 14px; background: rgba(74,144,255,0.15); border: 1.5px solid #4A90FF;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3 2.4v1.4M12 16.6v.1"/></svg>
          <span style="font-size: 10px; font-weight: 700;">Quiz</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px; border-radius: 14px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 4.2l3.4 3.4L9 18.4l-4.4 1 1-4.4z"/></svg>
          <span style="font-size: 10px; font-weight: 700; color: #A7C3E2;">Writing</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px; border-radius: 14px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0M12 18v3"/></svg>
          <span style="font-size: 10px; font-weight: 700; color: #A7C3E2;">Speaking</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 4px; border-radius: 14px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.4h4l8 9.2h4M4 16.6h4l2.2-2.6M14.6 8.6L16 7.4h4"/><path d="M18.4 5.2L20.6 7.4 18.4 9.6M18.4 14.4l2.2 2.2-2.2 2.2"/></svg>
          <span style="font-size: 10px; font-weight: 700; color: #A7C3E2;">Random</span>
        </div>
      </div>
    </div>

    <!-- Start -->
    <div style="margin-top: auto; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 9px; height: 52px; border-radius: 999px; background: #F2F5FF; box-shadow: 0 8px 26px rgba(74,144,255,0.30);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#0B1020"><path d="M8 5.2v13.6l11-6.8z"/></svg>
      <span class="h" style="font-size: 15px; font-weight: 700; color: #0B1020;">Start learning</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Token do truc tiep tu reference.png (xem docs/design/english-redesign/TOKENS.md) */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, "Segoe UI", system-ui, sans-serif; background: #020810; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
    a { color: #6FA8FF; } a:hover { color: #9CC5FF; }
    .h { font-family: "Space Grotesk", Manrope, system-ui, sans-serif; letter-spacing: -0.4px; }
    .eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: #9EB4CC; text-transform: uppercase; }
    /* Nen widget: sang o tren-trai, loang dan xuong toi. Vien tren sang, vien duoi TOI HON nen. */
    .card { border-radius: 18px;
      /* do tu anh goc: long the PHANG #0D1622 tren nen #02070F -> rgba(130,178,240,0.085) */
      background: rgba(130,178,240,0.085);
      border: 1px solid rgba(200,224,255,0.14);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.11); }
    .tile { border-radius: 13px;
      background: rgba(130,178,240,0.105);
      border: 1px solid rgba(200,224,255,0.12);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.09); }
    /* Chip icon: quang sang tron, KHONG vien */
    .chip { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      /* do tu anh goc: dem sang dat L45 tren nen the L21, co mep dia hoi ro */
      background: radial-gradient(circle at 50% 47%, rgba(194,222,255,0.185) 0%, rgba(184,212,252,0.165) 56%, rgba(168,202,248,0.125) 76%, rgba(150,188,240,0.035) 93%, rgba(140,180,236,0) 100%);
      box-shadow: inset 0 0 0 1px rgba(206,228,255,0.10); }
    .sub { font-size: 9px; font-weight: 500; color: #9BB9DA; }
    @keyframes wave { 0%, 100% { transform: scaleY(0.30); opacity: 0.45; } 50% { transform: scaleY(1); opacity: 0.95; } }
    .wv { width: 2px; border-radius: 999px; background: linear-gradient(180deg, rgba(120,175,255,0.85), rgba(74,144,255,0.25)); transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #020810;">

  <!-- Nen trang: #050C15 tren -> #020810 giua -> #01050D duoi (do tu anh goc) -->
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #071020 0%, #030A15 20%, #01060D 50%, #000409 76%, #000206 100%);"></div>

  <!-- Than + vanh sang hanh tinh goc tren-phai -->
  <div style="position: absolute; top: 0; left: 0; width: 900px; height: 900px; pointer-events: none;">
    <svg width="900" height="900" viewBox="0 0 900 900" fill="none">
      <defs>
        <radialGradient id="haze" gradientUnits="userSpaceOnUse" cx="352" cy="74" r="300">
          <stop offset="0%" stop-color="rgba(112,172,255,0.26)"/>
          <stop offset="44%" stop-color="rgba(70,124,226,0.10)"/>
          <stop offset="100%" stop-color="rgba(40,78,168,0)"/>
        </radialGradient>
        <linearGradient id="limb" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(158,205,255,0)"/>
          <stop offset="34%" stop-color="rgba(170,212,255,0.05)"/>
          <stop offset="60%" stop-color="rgba(214,236,255,0.55)"/>
          <stop offset="80%" stop-color="rgba(255,255,255,0.98)"/>
          <stop offset="100%" stop-color="rgba(180,216,255,0.46)"/>
        </linearGradient>
        <linearGradient id="limbSoft" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(120,172,255,0)"/>
          <stop offset="40%" stop-color="rgba(130,180,255,0.02)"/>
          <stop offset="68%" stop-color="rgba(158,202,255,0.26)"/>
          <stop offset="86%" stop-color="rgba(180,218,255,0.46)"/>
          <stop offset="100%" stop-color="rgba(150,196,255,0.20)"/>
        </linearGradient>
        <filter id="bWide" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="bMid" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3.4"/></filter>
        <filter id="bCore" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.0"/></filter>
      </defs>
      <circle cx="352" cy="74" r="300" fill="url(#haze)"/>
      <!-- Vanh sang = 3 lop nhoe chong nhau -> chi thay SANG DAM LEN, khong thay duong vien -->
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="34" opacity="0.62" filter="url(#bWide)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="10" filter="url(#bMid)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limb)" stroke-width="2.2" filter="url(#bCore)"/>
    </svg>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; pointer-events: none; background: linear-gradient(180deg, rgba(1,5,12,0) 0%, rgba(1,5,12,0.45) 52%, rgba(1,5,12,0.85) 100%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; padding: 14px 14px 20px;">

    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
      </div>
      <div class="h" style="font-size: 17.5px; font-weight: 700;">Pronunciation practice</div>
    </div>

    <!-- Sentence -->
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 18px; border-radius: 24px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); margin-bottom: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; color: #A7C3E2;">READ THIS SENTENCE</span>
        <div style="display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(130,178,240,0.105); border: 1px solid rgba(200,224,255,0.14);">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9.4v5.2h3.4l4.6 3.8V5.6L8.4 9.4z"/><path d="M16.4 9.2a4 4 0 0 1 0 5.6"/></svg>
          <span style="font-size: 10px; font-weight: 700; color: #9EC0FF;">Listen</span>
        </div>
      </div>
      <div class="h" style="font-size: 20.5px; font-weight: 700; line-height: 1.32; text-wrap: pretty;">
        <span>Don't</span> <span>close</span> <span style="color: #FF8FA8; border-bottom: 2px solid rgba(255,143,168,0.7);">your</span> <span>eyes</span> <span>tonight</span>
      </div>
      <div style="font-size: 11.5px; font-weight: 500; color: #9BB9DA;">Đừng nhắm mắt lại tối nay</div>
      <div style="font-size: 11px; font-weight: 600; color: #A7C3E2; letter-spacing: 0.2px;">/dəʊnt kləʊz jɔː(r) aɪz təˈnaɪt/</div>
    </div>

    <!-- Score -->
    <div style="display: flex; gap: 12px; margin-bottom: 18px;">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: linear-gradient(130deg, rgba(74,144,255,0.13), rgba(255,255,255,0.022)); border: 1px solid rgba(74,144,255,0.26);">
        <div style="position: relative; width: 58px; height: 58px; flex-shrink: 0;">
          <svg width="58" height="58" viewBox="0 0 58 58">
            <circle cx="29" cy="29" r="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="5"/>
            <circle cx="29" cy="29" r="24" fill="none" stroke="#7FC0FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="27" transform="rotate(-90 29 29)"/>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
            <div style="display: flex; align-items: baseline; gap: 1px;">
            <span class="h" style="font-size: 17.5px; font-weight: 700; line-height: 1;">82</span>
            <span style="font-size: 9.5px; font-weight: 600; line-height: 1; color: rgba(200,218,246,0.5);">%</span>
          </div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <div class="h" style="font-size: 14px; font-weight: 700;">Pretty good!</div>
          <div style="font-size: 10.5px; font-weight: 500; line-height: 1.35; color: #9BB9DA;">Watch the /jɔː(r)/ sound in <span style="color: #FF8FA8; font-weight: 700;">your</span></div>
        </div>
      </div>
    </div>

    <!-- Waveform -->
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px;">
      <div style="width: 3px; height: 18px; border-radius: 999px; background: rgba(255,255,255,0.10);"></div>
      <div style="width: 3px; height: 34px; border-radius: 999px; background: rgba(255,255,255,0.13);"></div>
      <div style="width: 3px; height: 58px; border-radius: 999px; background: #4A90FF;"></div>
      <div style="width: 3px; height: 86px; border-radius: 999px; background: #7FC0FF;"></div>
      <div style="width: 3px; height: 52px; border-radius: 999px; background: #4A90FF;"></div>
      <div style="width: 3px; height: 104px; border-radius: 999px; background: #7FC0FF;"></div>
      <div style="width: 3px; height: 66px; border-radius: 999px; background: #4A90FF;"></div>
      <div style="width: 3px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.13);"></div>
      <div style="width: 3px; height: 74px; border-radius: 999px; background: #4A90FF;"></div>
      <div style="width: 3px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.16);"></div>
      <div style="width: 3px; height: 92px; border-radius: 999px; background: #7FC0FF;"></div>
      <div style="width: 3px; height: 38px; border-radius: 999px; background: rgba(255,255,255,0.13);"></div>
      <div style="width: 3px; height: 62px; border-radius: 999px; background: #4A90FF;"></div>
      <div style="width: 3px; height: 26px; border-radius: 999px; background: rgba(255,255,255,0.10);"></div>
      <div style="width: 3px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.13);"></div>
      <div style="width: 3px; height: 20px; border-radius: 999px; background: rgba(255,255,255,0.10);"></div>
    </div>

    <!-- Mic -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 10px;">
      <div style="position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center;">
        <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(74,144,255,0.18);"></div>
        <div style="position: absolute; inset: 11px; border-radius: 50%; border: 1px solid rgba(74,144,255,0.32);"></div>
        <div style="position: absolute; inset: 22px; border-radius: 50%; background: linear-gradient(145deg, #4A90FF, #3555B8); box-shadow: 0 12px 38px rgba(74,144,255,0.45); display: flex; align-items: center; justify-content: center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F6FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0M12 18v3"/></svg>
        </div>
      </div>
      <div style="font-size: 11.5px; font-weight: 600; color: #9BB9DA;">Tap to stop recording</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Token do truc tiep tu reference.png (xem docs/design/english-redesign/TOKENS.md) */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, "Segoe UI", system-ui, sans-serif; background: #020810; color: #FFFFFF; -webkit-font-smoothing: antialiased; }
    a { color: #6FA8FF; } a:hover { color: #9CC5FF; }
    .h { font-family: "Space Grotesk", Manrope, system-ui, sans-serif; letter-spacing: -0.4px; }
    .eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: 1.5px; color: #9EB4CC; text-transform: uppercase; }
    /* Nen widget: sang o tren-trai, loang dan xuong toi. Vien tren sang, vien duoi TOI HON nen. */
    .card { border-radius: 18px;
      /* do tu anh goc: long the PHANG #0D1622 tren nen #02070F -> rgba(130,178,240,0.085) */
      background: rgba(130,178,240,0.085);
      border: 1px solid rgba(200,224,255,0.14);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.11); }
    .tile { border-radius: 13px;
      background: rgba(130,178,240,0.105);
      border: 1px solid rgba(200,224,255,0.12);
      box-shadow: inset 0 1px 0 rgba(212,232,255,0.09); }
    /* Chip icon: quang sang tron, KHONG vien */
    .chip { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      /* do tu anh goc: dem sang dat L45 tren nen the L21, co mep dia hoi ro */
      background: radial-gradient(circle at 50% 47%, rgba(194,222,255,0.185) 0%, rgba(184,212,252,0.165) 56%, rgba(168,202,248,0.125) 76%, rgba(150,188,240,0.035) 93%, rgba(140,180,236,0) 100%);
      box-shadow: inset 0 0 0 1px rgba(206,228,255,0.10); }
    .sub { font-size: 9px; font-weight: 500; color: #9BB9DA; }
    @keyframes wave { 0%, 100% { transform: scaleY(0.30); opacity: 0.45; } 50% { transform: scaleY(1); opacity: 0.95; } }
    .wv { width: 2px; border-radius: 999px; background: linear-gradient(180deg, rgba(120,175,255,0.85), rgba(74,144,255,0.25)); transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #020810;">

  <!-- Nen trang: #050C15 tren -> #020810 giua -> #01050D duoi (do tu anh goc) -->
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, #071020 0%, #030A15 20%, #01060D 50%, #000409 76%, #000206 100%);"></div>

  <!-- Than + vanh sang hanh tinh goc tren-phai -->
  <div style="position: absolute; top: 0; left: 0; width: 900px; height: 900px; pointer-events: none;">
    <svg width="900" height="900" viewBox="0 0 900 900" fill="none">
      <defs>
        <radialGradient id="haze" gradientUnits="userSpaceOnUse" cx="352" cy="74" r="300">
          <stop offset="0%" stop-color="rgba(112,172,255,0.26)"/>
          <stop offset="44%" stop-color="rgba(70,124,226,0.10)"/>
          <stop offset="100%" stop-color="rgba(40,78,168,0)"/>
        </radialGradient>
        <linearGradient id="limb" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(158,205,255,0)"/>
          <stop offset="34%" stop-color="rgba(170,212,255,0.05)"/>
          <stop offset="60%" stop-color="rgba(214,236,255,0.55)"/>
          <stop offset="80%" stop-color="rgba(255,255,255,0.98)"/>
          <stop offset="100%" stop-color="rgba(180,216,255,0.46)"/>
        </linearGradient>
        <linearGradient id="limbSoft" gradientUnits="userSpaceOnUse" x1="120" y1="240" x2="392" y2="52">
          <stop offset="0%" stop-color="rgba(120,172,255,0)"/>
          <stop offset="40%" stop-color="rgba(130,180,255,0.02)"/>
          <stop offset="68%" stop-color="rgba(158,202,255,0.26)"/>
          <stop offset="86%" stop-color="rgba(180,218,255,0.46)"/>
          <stop offset="100%" stop-color="rgba(150,196,255,0.20)"/>
        </linearGradient>
        <filter id="bWide" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="bMid" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3.4"/></filter>
        <filter id="bCore" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="1.0"/></filter>
      </defs>
      <circle cx="352" cy="74" r="300" fill="url(#haze)"/>
      <!-- Vanh sang = 3 lop nhoe chong nhau -> chi thay SANG DAM LEN, khong thay duong vien -->
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="34" opacity="0.62" filter="url(#bWide)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limbSoft)" stroke-width="10" filter="url(#bMid)"/>
      <circle cx="452" cy="434" r="379" fill="none" stroke="url(#limb)" stroke-width="2.2" filter="url(#bCore)"/>
    </svg>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; pointer-events: none; background: linear-gradient(180deg, rgba(1,5,12,0) 0%, rgba(1,5,12,0.45) 52%, rgba(1,5,12,0.85) 100%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; height: 100%; padding: 14px 14px 0;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
      </div>
      <div class="h" style="font-size: 17.5px; font-weight: 700;">Profile</div>
    </div>

    <!-- Identity -->
    <div style="display: flex; align-items: center; gap: 15px; padding: 18px 16px; border-radius: 24px; background: linear-gradient(130deg, rgba(74,144,255,0.11), rgba(255,255,255,0.022)); border: 1px solid rgba(200,224,255,0.14);">
      <div style="width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0; border: 1.6px solid rgba(74,144,255,0.8); background: linear-gradient(145deg, rgba(74,144,255,0.26), rgba(74,144,255,0.04)); display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.6-3.7 3.6-5.6 7.2-5.6s6.6 1.9 7.2 5.6"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
        <div class="h" style="font-size: 16.5px; font-weight: 700;">Quang Hua</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(74,144,255,0.16); border: 1px solid rgba(74,144,255,0.34);">
            <span style="font-size: 10px; font-weight: 800; color: #9EC0FF;">Lv 8 · Intermediate</span>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 4px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7FC0FF" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.2s4.6 3.6 4.6 8.2a4.6 4.6 0 0 1-9.2 0c0-1.5.6-2.7 1.4-3.7.3 1.2 1 2 1.9 2.2-.4-2.8.5-5.1 1.3-6.7z"/></svg>
            <span style="font-size: 10px; font-weight: 700; color: #A7C3E2;">7 days</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats grid -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linejoin="round"><rect x="3.6" y="5" width="12" height="15" rx="2"/><path d="M7.4 3h11a2 2 0 0 1 2 2v12"/></svg>
        <span class="h" style="font-size: 20.5px; font-weight: 700;">248</span>
        <span style="font-size: 10px; font-weight: 500; color: #9BB9DA;">Words learned</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linejoin="round"><circle cx="7" cy="17.4" r="2.8"/><circle cx="17.6" cy="15.2" r="2.8"/><path d="M9.8 17.4V6.2l10.6-2.2v11.2"/></svg>
        <span class="h" style="font-size: 20.5px; font-weight: 700;">14</span>
        <span style="font-size: 10px; font-weight: 500; color: #9BB9DA;">Songs completed</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0M12 18v3"/></svg>
        <span class="h" style="font-size: 20.5px; font-weight: 700;">82<span style="font-size: 12px; color: rgba(200,218,246,0.5);">%</span></span>
        <span style="font-size: 10px; font-weight: 500; color: #9BB9DA;">Avg. pronunciation</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 18px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.8"/></svg>
        <span class="h" style="font-size: 20.5px; font-weight: 700;">6h 20<span style="font-size: 12px; color: rgba(200,218,246,0.5);">p</span></span>
        <span style="font-size: 10px; font-weight: 500; color: #9BB9DA;">Practice time</span>
      </div>
    </div>

    <!-- Weekly activity -->
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 22px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14);">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="h" style="font-size: 12.5px; font-weight: 700;">This week</span>
        <span style="font-size: 10px; font-weight: 600; color: #93AECE;">min / day</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 78px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 26%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Mon</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 52%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Tue</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 38%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Wed</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 76%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Thu</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 44%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Fri</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 62%; border-radius: 6px 6px 3px 3px; background: rgba(74,144,255,0.34);"></div>
          <span style="font-size: 9px; font-weight: 600; color: #93AECE;">Sat</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #7FC0FF, #4A90FF);"></div>
          <span style="font-size: 9px; font-weight: 700; color: #9EC0FF;">Sun</span>
        </div>
      </div>
    </div>

    <!-- Settings rows -->
    <div style="display: flex; flex-direction: column; border-radius: 22px; background: rgba(130,178,240,0.085); border: 1px solid rgba(200,224,255,0.14); overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="8.6"/><path d="M3.4 12h17.2M12 3.4c2.2 2.4 3.4 5.4 3.4 8.6S14.2 18.2 12 20.6c-2.2-2.4-3.4-5.4-3.4-8.6S9.8 5.8 12 3.4z"/></svg>
        <span style="flex-grow: 1; font-size: 12.5px; font-weight: 600;">Language</span>
        <span style="font-size: 11px; font-weight: 600; color: #9BB9DA;">English</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(200,218,246,0.38)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E8EDF7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M18.6 15.4a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.3 1.4z"/><circle cx="12" cy="12" r="2.6"/></svg>
        <span style="flex-grow: 1; font-size: 12.5px; font-weight: 600;">Settings & services</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(200,218,246,0.38)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.06);"></div>
      <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF8FA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M14.4 17.4v1.6a2 2 0 0 1-2 2H5.6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6.8a2 2 0 0 1 2 2v1.6M18.4 15.4l3.2-3.4-3.2-3.4M21.6 12H9.4"/></svg>
        <span style="flex-grow: 1; font-size: 12.5px; font-weight: 600; color: #FF8FA8;">Sign out</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>

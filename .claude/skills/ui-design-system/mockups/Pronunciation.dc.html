<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing:border-box; }
  body{ margin:0; }
  .screen{
    width:100%; height:100%; border-radius:28px; overflow:hidden; position:relative;
    background:
      radial-gradient(90% 50% at 50% -5%, rgba(91,140,255,.35), transparent 60%),
      linear-gradient(170deg,#0a0e1c 0%,#0d1330 55%,#080b16 100%);
    color:#eef1fb; font-family:'Manrope',system-ui,sans-serif;
    display:flex; flex-direction:column; padding:26px 24px 24px;
  }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  a{ color:#9db4ff; } a:hover{ color:#c2cfff; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; }
  .icon-btn{ width:38px; height:38px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; }
  .top-label{ font-size:12px; font-weight:700; color:rgba(238,241,251,.5); text-transform:uppercase; letter-spacing:.08em; }
  .sentence-card{
    margin-top:20px; padding:20px; border-radius:22px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
  }
  .sentence-card .lbl{ font-size:11px; font-weight:800; color:rgba(238,241,251,.4); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .sentence-card .en{ font-size:19px; font-weight:800; line-height:1.35; }
  .sentence-card .vi{ font-size:13px; color:rgba(238,241,251,.55); margin-top:8px; font-weight:600; }
  .mic-zone{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .mic-rings{ position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; }
  .ring{ position:absolute; border-radius:999px; border:1.5px solid rgba(91,140,255,.35); }
  .ring.r1{ width:150px; height:150px; }
  .ring.r2{ width:118px; height:118px; border-color:rgba(155,107,255,.4); }
  .mic-btn{
    width:88px; height:88px; border-radius:999px; z-index:1;
    background:linear-gradient(135deg,#5b8cff,#9b6bff);
    box-shadow:0 25px 50px rgba(91,140,255,.55), 0 0 60px rgba(155,107,255,.4);
    display:flex; align-items:center; justify-content:center;
  }
  .mic-hint{ font-size:13px; font-weight:700; color:rgba(238,241,251,.55); }
  .waveform{ display:flex; align-items:flex-end; gap:4px; height:36px; }
  .waveform span{ width:4px; border-radius:4px; background:linear-gradient(180deg,#9b6bff,#5b8cff); }
  .score-card{
    display:flex; align-items:center; gap:16px; padding:18px; border-radius:22px;
    background:rgba(255,255,255,.96); color:#0b1220; box-shadow:0 24px 48px rgba(0,0,0,.35);
  }
  .ring-score{ position:relative; width:64px; height:64px; border-radius:999px; background:conic-gradient(#5b8cff 0deg 306deg, rgba(11,18,32,.1) 306deg 360deg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ring-score::before{ content:''; position:absolute; inset:6px; border-radius:999px; background:#fff; }
  .ring-score span{ position:relative; font-size:16px; font-weight:800; }
  .score-detail{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .score-detail .big{ font-size:13px; font-weight:800; }
  .word-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .word-chip{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .word-chip.good{ background:rgba(91,224,208,.18); color:#1a8f7e; }
  .word-chip.mid{ background:rgba(255,178,60,.2); color:#a5680a; }
  .word-chip.bad{ background:rgba(255,107,140,.18); color:#c22a54; }
  .bottom-actions{ display:flex; gap:12px; margin-top:20px; }
  .btn-pill{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:15px; border-radius:999px; font-weight:800; font-size:14px; }
  .btn-pill.outline{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:#eef1fb; }
  .btn-pill.primary{ background:linear-gradient(135deg,#5b8cff,#9b6bff); color:#fff; box-shadow:0 14px 30px rgba(91,140,255,.5); }
</style>
</helmet>

<div class="screen">
  <div class="top-row">
    <div class="icon-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eef1fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></div>
    <div class="top-label">Luyện phát âm</div>
    <div style="width:38px"></div>
  </div>

  <div class="sentence-card">
    <div class="lbl">Đọc theo câu này</div>
    <div class="en">Now I'm standing in the rain</div>
    <div class="vi">Giờ tôi đứng lặng giữa cơn mưa</div>
  </div>

  <div class="mic-zone">
    <div class="mic-rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="mic-btn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
      </div>
    </div>
    <div class="mic-hint">Chạm để bắt đầu ghi âm</div>
    <div class="waveform">
      <span style="height:10px"></span><span style="height:22px"></span><span style="height:14px"></span>
      <span style="height:30px"></span><span style="height:18px"></span><span style="height:26px"></span>
      <span style="height:12px"></span><span style="height:20px"></span><span style="height:8px"></span>
    </div>
  </div>

  <div class="score-card">
    <div class="ring-score"><span>85%</span></div>
    <div class="score-detail">
      <div class="big">Khá tốt! Chú ý âm cuối.</div>
      <div class="word-chips">
        <span class="word-chip good">Now</span>
        <span class="word-chip good">I'm</span>
        <span class="word-chip mid">standing</span>
        <span class="word-chip good">in</span>
        <span class="word-chip bad">rain</span>
      </div>
    </div>
  </div>

  <div class="bottom-actions">
    <div class="btn-pill outline">Thử lại</div>
    <div class="btn-pill primary">Câu tiếp theo</div>
  </div>
</div>
</x-dc>
</body>
</html>

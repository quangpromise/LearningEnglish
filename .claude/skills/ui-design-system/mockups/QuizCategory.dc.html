<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing:border-box; }
  body{ margin:0; }
  .screen{
    width:100%; height:100%; border-radius:28px; overflow:hidden; position:relative;
    background:
      radial-gradient(110% 60% at 20% -10%, rgba(91,140,255,.35), transparent 60%),
      radial-gradient(90% 50% at 110% 10%, rgba(155,107,255,.28), transparent 55%),
      linear-gradient(160deg,#0a0e1c 0%,#0d1330 55%,#090c18 100%);
    color:#eef1fb; font-family:'Manrope',system-ui,sans-serif;
    display:flex; flex-direction:column; padding:28px 24px 24px; gap:18px;
  }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  a{ color:#9db4ff; } a:hover{ color:#c2cfff; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; }
  .title-block h2{ font-size:22px; font-weight:700; }
  .title-block p{ margin:4px 0 0; font-size:13px; color:rgba(238,241,251,.55); font-weight:600; }
  .xp-pill{
    display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
    background:rgba(255,178,60,.14); color:#ffb23c; font-size:12px; font-weight:800;
  }
  .grid{ flex:1; overflow:hidden; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-content:start; }
  .cat-card{
    padding:18px; border-radius:22px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    display:flex; flex-direction:column; gap:10px;
  }
  .cat-icon{ width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .cat-icon.a{ background:linear-gradient(135deg,#5b8cff,#9b6bff); box-shadow:0 10px 24px rgba(91,140,255,.45); }
  .cat-icon.b{ background:linear-gradient(135deg,#5be0d0,#5b8cff); box-shadow:0 10px 24px rgba(91,224,208,.35); }
  .cat-icon.c{ background:linear-gradient(135deg,#ff9d7d,#ff6b9d); box-shadow:0 10px 24px rgba(255,109,157,.35); }
  .cat-icon.d{ background:linear-gradient(135deg,#ffd66b,#ff9d7d); box-shadow:0 10px 24px rgba(255,214,107,.3); }
  .cat-icon.e{ background:linear-gradient(135deg,#9b6bff,#ff6b9d); box-shadow:0 10px 24px rgba(155,107,255,.35); }
  .cat-icon.f{ background:linear-gradient(135deg,#5b8cff,#5be0d0); box-shadow:0 10px 24px rgba(91,140,255,.35); }
  .cat-card .name{ font-size:14px; font-weight:800; }
  .cat-card .count{ font-size:11px; color:rgba(238,241,251,.45); font-weight:700; }
  .dots{ display:flex; gap:4px; margin-top:2px; }
  .dot{ width:6px; height:6px; border-radius:999px; background:rgba(255,255,255,.15); }
  .dot.on{ background:linear-gradient(135deg,#5b8cff,#9b6bff); }
</style>
</helmet>

<div class="screen">
  <div class="top-row">
    <div class="title-block">
      <h2>Đố vui tiếng Anh</h2>
      <p>Chọn chủ đề để bắt đầu thử thách</p>
    </div>
    <div class="xp-pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-13h-7z"/></svg>
      1,240 XP
    </div>
  </div>

  <div class="grid">
    <div class="cat-card">
      <div class="cat-icon a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2v0a2 2 0 0 0-2 2h0a2 2 0 0 0 2 2v0a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v0a2 2 0 0 0-2-2h0a2 2 0 0 0-2 2v0a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h0a2 2 0 0 0 2-2v0a2 2 0 0 0-2-2H6a2 2 0 0 1-2-2z"/></svg></div>
      <div class="name">Chơi chữ</div>
      <div class="count">18 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div></div>
    </div>
    <div class="cat-card">
      <div class="cat-icon b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.3h6c0-1.1.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg></div>
      <div class="name">Suy luận</div>
      <div class="count">22 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div></div>
    </div>
    <div class="cat-card">
      <div class="cat-icon c"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4c-1.5 0-3 1-3 3 0 1 .5 2 1 2-2 0-4 1.5-4 4s2 4 4.5 4c.5 1.5 2 2.5 3.5 2.5s3-1 3.5-2.5C16 19 18 17 18 14.5s-2-4-4-4c.5 0 1-1 1-2 0-2-1.5-3-3-3-.7 0-1.4.3-2 .8-.6-.5-1.3-.8-2-.8z"/></svg></div>
      <div class="name">Động vật</div>
      <div class="count">15 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="cat-card">
      <div class="cat-icon d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 12a9 9 0 0 1 9-9m-9 9a9 9 0 0 0 9 9m0-18a9 9 0 0 1 9 9m-9-9a13 13 0 0 1 0 18m0-18a13 13 0 0 0 0 18m9-9a9 9 0 0 1-9 9"/></svg></div>
      <div class="name">Cuộc sống</div>
      <div class="count">20 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div></div>
    </div>
    <div class="cat-card">
      <div class="cat-icon e"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></div>
      <div class="name">Bảng chữ cái</div>
      <div class="count">10 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
    <div class="cat-card">
      <div class="cat-icon f"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17h-1a1 1 0 0 1-1-1v-3l2-4h9l3 4h1a2 2 0 0 1 2 2v1h-2"/><path d="M9 17h6"/></svg></div>
      <div class="name">Trái cây &amp; xe cộ</div>
      <div class="count">14 câu đố</div>
      <div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

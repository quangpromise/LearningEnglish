<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing:border-box; }
  body{ margin:0; }
  .screen{
    width:100%; height:100%; border-radius:28px; overflow:hidden; position:relative;
    background:
      radial-gradient(90% 55% at 50% -5%, rgba(155,107,255,.35), transparent 60%),
      linear-gradient(170deg,#0a0e1c 0%,#0d1330 55%,#080b16 100%);
    color:#eef1fb; font-family:'Manrope',system-ui,sans-serif;
  }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  a{ color:#9db4ff; } a:hover{ color:#c2cfff; }
  .backdrop{ position:absolute; inset:0; padding:26px 24px; filter:blur(2px) brightness(.5); opacity:.7; }
  .bd-line{ text-align:center; margin-top:120px; }
  .bd-line .en{ font-size:20px; font-weight:800; color:#c9a8ff; }
  .bd-line .vi{ font-size:13px; color:rgba(238,241,251,.5); margin-top:6px; font-weight:600; }
  .word-hit{
    display:inline-block; margin-top:16px; padding:4px 10px; border-radius:10px;
    background:rgba(155,107,255,.25); box-shadow:0 0 0 2px rgba(155,107,255,.5);
    font-weight:800; font-size:20px; color:#fff;
  }
  .sheet{
    position:absolute; left:0; right:0; bottom:0; border-radius:32px 32px 0 0;
    background: rgba(15,19,38,.92); backdrop-filter: blur(24px);
    border:1px solid rgba(255,255,255,.1); border-bottom:none;
    box-shadow:0 -30px 60px rgba(0,0,0,.5);
    padding:14px 24px 28px; display:flex; flex-direction:column; gap:16px;
  }
  .handle{ width:40px; height:5px; border-radius:999px; background:rgba(255,255,255,.2); margin:0 auto; }
  .word-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .word-main{ display:flex; flex-direction:column; gap:4px; }
  .word-main .word{ font-size:28px; font-weight:800; font-family:'Space Grotesk',sans-serif; }
  .word-main .ipa{ font-size:14px; color:#9db4ff; font-weight:600; }
  .pos-tag{ font-size:11px; font-weight:800; padding:5px 12px; border-radius:999px; background:rgba(91,224,208,.15); color:#5be0d0; text-transform:uppercase; letter-spacing:.05em; }
  .meaning{ font-size:16px; font-weight:700; color:#fff; }
  .example-card{
    padding:14px 16px; border-radius:18px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  }
  .example-card .lbl{ font-size:11px; font-weight:800; color:rgba(238,241,251,.4); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .example-card .en{ font-size:14px; font-weight:700; }
  .example-card .en .hl{ color:#c9a8ff; }
  .example-card .vi{ font-size:12px; color:rgba(238,241,251,.55); margin-top:4px; font-weight:600; }
  .actions{ display:flex; gap:12px; margin-top:4px; }
  .btn-pill{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:15px; border-radius:999px; font-weight:800; font-size:14px; }
  .btn-pill.primary{ background:linear-gradient(135deg,#5b8cff,#9b6bff); color:#fff; box-shadow:0 14px 30px rgba(91,140,255,.5); }
  .btn-pill.outline{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:#eef1fb; }
</style>
</helmet>

<div class="screen">
  <div class="backdrop">
    <div class="bd-line">
      <div class="en">Now I'm standing in the <span class="word-hit">rain</span></div>
      <div class="vi">Giờ tôi đứng lặng giữa cơn mưa</div>
    </div>
  </div>

  <div class="sheet">
    <div class="handle"></div>
    <div class="word-head">
      <div class="word-main">
        <div class="word">rain</div>
        <div class="ipa">/reɪn/</div>
      </div>
      <span class="pos-tag">Danh từ</span>
    </div>
    <div class="meaning">mưa</div>
    <div class="example-card">
      <div class="lbl">Trong bài hát</div>
      <div class="en">Now I'm standing in the <span class="hl">rain</span></div>
      <div class="vi">Giờ tôi đứng lặng giữa cơn mưa</div>
    </div>
    <div class="actions">
      <div class="btn-pill primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        Nghe phát âm
      </div>
      <div class="btn-pill outline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#eef1fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Lưu từ
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; }
  .screen{
    width:100%; height:100%; border-radius:28px; overflow:hidden; position:relative;
    background:
      radial-gradient(120% 60% at 15% -10%, rgba(91,140,255,.35), transparent 60%),
      radial-gradient(90% 50% at 110% 10%, rgba(155,107,255,.28), transparent 55%),
      linear-gradient(160deg,#0a0e1c 0%, #0d1330 55%, #090c18 100%);
    color:#eef1fb; font-family:'Manrope',system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  a{ color:#9db4ff; } a:hover{ color:#c2cfff; }
  .top{ padding:28px 24px 8px; display:flex; flex-direction:column; gap:16px; }
  .hello-row{ display:flex; align-items:center; justify-content:space-between; }
  .hello{ display:flex; flex-direction:column; gap:2px; }
  .hello .greet{ font-size:13px; color:rgba(238,241,251,.55); font-weight:600; }
  .hello .name{ font-size:20px; font-weight:700; }
  .bell{
    width:42px; height:42px; border-radius:999px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;
  }
  .search{
    display:flex; align-items:center; gap:10px; padding:14px 18px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  }
  .search input{ display:none; }
  .search span{ color:rgba(238,241,251,.5); font-size:14px; font-weight:600; }
  .scroll{ flex:1; overflow:hidden; padding:4px 24px 0; display:flex; flex-direction:column; gap:22px; }
  .continue-card{
    border-radius:26px; padding:18px; background:rgba(255,255,255,.96); color:#0b1220;
    box-shadow: 0 24px 48px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.6) inset;
    display:flex; gap:14px; align-items:center;
  }
  .art{
    width:64px; height:64px; border-radius:18px; flex-shrink:0;
    background:linear-gradient(135deg,#5b8cff,#9b6bff);
    box-shadow:0 10px 24px rgba(91,140,255,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .continue-info{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .continue-info .label{ font-size:11px; font-weight:700; color:#7c5cff; text-transform:uppercase; letter-spacing:.06em; }
  .continue-info .title{ font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .continue-info .sub{ font-size:12px; color:rgba(11,18,32,.55); font-weight:600; }
  .progress-track{ height:6px; border-radius:999px; background:rgba(11,18,32,.1); margin-top:2px; overflow:hidden; }
  .progress-fill{ height:100%; width:62%; border-radius:999px; background:linear-gradient(90deg,#5b8cff,#9b6bff); }
  .play-mini{
    width:44px; height:44px; border-radius:999px; flex-shrink:0;
    background:linear-gradient(135deg,#5b8cff,#9b6bff); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(91,140,255,.55);
  }
  .chips{ display:flex; gap:10px; overflow:hidden; }
  .chip{
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:rgba(238,241,251,.8);
  }
  .chip.active{
    background:linear-gradient(135deg,#5b8cff,#9b6bff); color:#fff; border:none;
    box-shadow:0 8px 20px rgba(91,140,255,.45);
  }
  .section-head{ display:flex; align-items:center; justify-content:space-between; }
  .section-head h3{ font-size:16px; font-weight:700; }
  .section-head .see-all{ font-size:12px; font-weight:700; color:#9db4ff; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .row-card{
    display:flex; align-items:center; gap:14px; padding:12px; border-radius:20px;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08);
  }
  .cover{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .cover.c1{ background:linear-gradient(135deg,#ff9d7d,#ff6b9d); }
  .cover.c2{ background:linear-gradient(135deg,#5be0d0,#5b8cff); }
  .cover.c3{ background:linear-gradient(135deg,#ffd66b,#ff9d7d); }
  .row-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .row-info .t{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-info .a{ font-size:12px; color:rgba(238,241,251,.5); font-weight:600; }
  .level{
    font-size:10px; font-weight:800; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
  }
  .level.beg{ background:rgba(91,224,208,.15); color:#5be0d0; }
  .level.mid{ background:rgba(255,214,107,.15); color:#ffd66b; }
  .dur{ font-size:11px; color:rgba(238,241,251,.4); font-weight:700; }
  .navbar{
    margin:14px 20px 20px; padding:12px 22px; border-radius:999px;
    background:rgba(10,14,28,.85); border:1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(20px);
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:rgba(238,241,251,.4); }
  .nav-item.active{ color:#fff; }
  .nav-dot{ width:6px; height:6px; border-radius:999px; background:linear-gradient(135deg,#5b8cff,#9b6bff); box-shadow:0 0 12px #7c9bff; }
</style>
</helmet>

<div class="screen">
  <div class="top">
    <div class="hello-row">
      <div class="hello">
        <div class="greet">Xin chào</div>
        <div class="name">Quang</div>
      </div>
      <div class="bell">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eef1fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(238,241,251,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Tìm bài hát, ca sĩ...</span>
    </div>
  </div>

  <div class="scroll">
    <div class="continue-card">
      <div class="art">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="continue-info">
        <div class="label">Đang học dở</div>
        <div class="title">Sunny Afternoon</div>
        <div class="sub">Clara Voss · Câu 14/22</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>
      <div class="play-mini">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <div class="chips">
      <div class="chip active">Tất cả</div>
      <div class="chip">Acoustic</div>
      <div class="chip">Pop</div>
      <div class="chip">Indie</div>
      <div class="chip">Ballad</div>
    </div>

    <div>
      <div class="section-head"><h3>Gợi ý cho bạn</h3><span class="see-all">Xem tất cả</span></div>
      <div class="list" style="margin-top:12px">
        <div class="row-card">
          <div class="cover c1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
          <div class="row-info">
            <div class="t">Golden Hour</div>
            <div class="a">Mara Lane · 3:42</div>
          </div>
          <span class="level beg">Cơ bản</span>
        </div>
        <div class="row-card">
          <div class="cover c2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
          <div class="row-info">
            <div class="t">Paper Boats</div>
            <div class="a">The Wandering Few · 4:05</div>
          </div>
          <span class="level mid">Trung cấp</span>
        </div>
        <div class="row-card">
          <div class="cover c3"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
          <div class="row-info">
            <div class="t">City Lights</div>
            <div class="a">Noah Rivers · 3:20</div>
          </div>
          <span class="level beg">Cơ bản</span>
        </div>
      </div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      <div class="nav-dot"></div>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10M18 20V4M6 20v-6"/></svg>
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

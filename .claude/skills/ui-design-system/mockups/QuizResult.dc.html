<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
  * { box-sizing:border-box; }
  body{ margin:0; }
  .screen{
    width:100%; height:100%; border-radius:28px; overflow:hidden; position:relative;
    background:
      radial-gradient(100% 55% at 50% -8%, rgba(155,107,255,.4), transparent 60%),
      linear-gradient(170deg,#0a0e1c 0%,#0d1330 55%,#080b16 100%);
    color:#eef1fb; font-family:'Manrope',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:34px 24px 24px; gap:16px;
  }
  h1,h2,h3{ font-family:'Space Grotesk',system-ui,sans-serif; margin:0; letter-spacing:-.01em; }
  a{ color:#9db4ff; } a:hover{ color:#c2cfff; }
  .badge{ font-size:12px; font-weight:800; color:#c9a8ff; text-transform:uppercase; letter-spacing:.08em; }
  .score-ring{
    position:relative; width:140px; height:140px; border-radius:999px; margin:14px 0 4px;
    background:conic-gradient(#5b8cff 0deg 288deg, rgba(255,255,255,.08) 288deg 360deg);
    display:flex; align-items:center; justify-content:center;
  }
  .score-ring::before{ content:''; position:absolute; inset:10px; border-radius:999px; background:#0d1330; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
  .score-ring .val{ position:relative; font-family:'Space Grotesk',sans-serif; font-size:30px; font-weight:700; }
  .score-ring .sub{ position:relative; font-size:11px; color:rgba(238,241,251,.5); font-weight:700; margin-top:-4px; }
  .xp-earn{
    display:flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px;
    background:linear-gradient(135deg,#5b8cff,#9b6bff); color:#fff; font-weight:800; font-size:13px;
    box-shadow:0 14px 30px rgba(91,140,255,.45);
  }
  .rank-card{
    width:100%; display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:20px;
    background:rgba(91,224,208,.1); border:1px solid rgba(91,224,208,.3);
  }
  .rank-card .arrow{ width:36px; height:36px; border-radius:999px; background:rgba(91,224,208,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rank-card .txt{ font-size:13px; font-weight:700; }
  .rank-card .txt b{ color:#5be0d0; }
  .list{ width:100%; flex:1; overflow:hidden; display:flex; flex-direction:column; gap:8px; }
  .list .head{ font-size:11px; font-weight:800; color:rgba(238,241,251,.4); text-transform:uppercase; letter-spacing:.06em; }
  .row{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.04); }
  .row .st{ width:22px; height:22px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row .st.ok{ background:rgba(91,224,208,.2); color:#5be0d0; }
  .row .st.no{ background:rgba(255,107,140,.18); color:#ff6b9d; }
  .row .q{ font-size:12px; font-weight:600; color:rgba(238,241,251,.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actions{ width:100%; display:flex; gap:12px; }
  .btn-pill{ flex:1; text-align:center; padding:15px; border-radius:999px; font-weight:800; font-size:14px; }
  .btn-pill.outline{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); color:#eef1fb; }
  .btn-pill.primary{ background:linear-gradient(135deg,#5b8cff,#9b6bff); color:#fff; box-shadow:0 14px 30px rgba(91,140,255,.5); }
</style>
</helmet>

<div class="screen">
  <div class="badge">Hoàn thành thử thách</div>
  <div class="score-ring">
    <div>
      <div class="val">8/10</div>
      <div class="sub">câu đúng</div>
    </div>
  </div>
  <div class="xp-earn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 3 14h7l-1 8 11-13h-7z"/></svg>
    +120 XP
  </div>

  <div class="rank-card">
    <div class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5be0d0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></div>
    <div class="txt">Bạn đã lên hạng <b>#12 → #7</b> tuần này</div>
  </div>

  <div class="list">
    <div class="head">Chi tiết từng câu</div>
    <div class="row"><div class="st ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="q">What has an eye, but cannot see?</div></div>
    <div class="row"><div class="st ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="q">I have a long nose and love peanuts.</div></div>
    <div class="row"><div class="st no"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div><div class="q">What is full of holes but still holds water?</div></div>
    <div class="row"><div class="st ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="q">Who always drives his customers away?</div></div>
  </div>

  <div class="actions">
    <div class="btn-pill outline">Làm lại</div>
    <div class="btn-pill primary">Xem bảng xếp hạng</div>
  </div>
</div>
</x-dc>
</body>
</html>

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Cong gac ban quyen cua pipeline them bai hat (scripts/add_songs.py) chan
  # nhung track khong chung minh duoc quyen dung thuong mai. Logic do chi co
  # gia tri khi no thuc su chay - nen cho chay o CI luon.
  song-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test pipeline thêm bài hát
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

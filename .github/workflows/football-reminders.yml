name: Football reminders

# Goi dinh ky Edge Function football-reminders - 2 loai thong bao TRUOC tran
# ma football-live khong lo duoc (ham do chi nhin cac tran dang da):
#   * nhac truoc 1 ngay khi doi yeu thich co tran
#   * bao khi doi hinh chinh thuc duoc cong bo
#
# 30 phut/lan la du: cua so nhac truoc 1 ngay rong 4 tieng (22h-26h truoc gio
# bong lan) nen khong the truot, con doi hinh cong bo ~60 phut truoc tran thi
# tre toi da 30 phut van con kip xem truoc khi bong lan.
#
# Ham tu thoat ngay khi CHUA AI chon doi yeu thich, va moi lan goi API deu
# qua bo dem football_api_budget - nen chay day cung khong lam no quota.
#
# Can 2 secret trong GitHub repo settings:
#   FOOTBALL_REMINDERS_FUNCTION_URL
#   FOOTBALL_WEBHOOK_SECRET  (dung chung voi 2 workflow kia)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call football-reminders function
        run: |
          curl -sf -X POST "${{ secrets.FOOTBALL_REMINDERS_FUNCTION_URL }}" \
            -H "x-webhook-secret: ${{ secrets.FOOTBALL_WEBHOOK_SECRET }}"

name: Football live

# Goi dinh ky Edge Function football-live (xem
# supabase/functions/football-live/index.ts) - quet cac tran DANG DA, ghi su
# kien moi va gui push cho nguoi co doi yeu thich trong tran.
#
# VE NHIP CHAY - doc ky truoc khi sua:
# GitHub Actions cron KHONG chay duoc duoi 5 phut, va thuc te con hay tre
# them vai phut khi ha tang ban. Vay nen:
#   * Cron dat 5 phut/lan CHI trong khung gio co bong o chau Au (11:00-23:59
#     UTC = 18:00-07:00 gio Viet Nam). Ngoai khung do gan nhu khong co tran
#     nao cua 6 giai lon, quet chi phi pham quota.
#   * Moi lan chay ton DUNG 1 request API-Football (endpoint `live=all` tra
#     ve moi tran dang da trong 1 call) -> toi da ~156 lan/ngay, nhung bo dem
#     football_api_budget chan cung o 100/ngay nen khong bao gio vuot.
# Muon nhip nhanh hon 5 phut (vd 60 giay khi da nang goi tra phi) thi phai
# chuyen sang pg_cron trong chinh Supabase - xem docs/football-center-plan.md.
#
# Can 2 secret trong GitHub repo settings:
#   FOOTBALL_LIVE_FUNCTION_URL - https://<project>.supabase.co/functions/v1/football-live
#   FOOTBALL_WEBHOOK_SECRET    - dung chung voi football-sync
on:
  schedule:
    - cron: '*/5 11-23 * * *'
  workflow_dispatch: {}

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Call football-live function
        run: |
          curl -sf -X POST "${{ secrets.FOOTBALL_LIVE_FUNCTION_URL }}" \
            -H "x-webhook-secret: ${{ secrets.FOOTBALL_WEBHOOK_SECRET }}"

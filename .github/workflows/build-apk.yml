name: Build & Publish APK

permissions:
  contents: write

# Nhieu lan push kem "[build]" gan nhau (vd sua nhieu loi lien tiep trong 1
# buoi) co the khien 2 lan chay CUNG GHI vao 1 release "latest" duy nhat -
# neu lan chay cua commit CU hoan tat SAU lan chay cua commit MOI (do thoi
# gian cho hang doi runner khac nhau, khong lien quan gi den thu tu commit),
# no se GHI DE APK/mo ta cua ban MOI bang noi dung CU hon, khien nguoi dung
# cai lai van thay ban cu ma khong biet. cancel-in-progress: true dam bao khi
# co lan chay MOI hon bat dau, lan chay CU dang do se bi huy ngay - chi con
# lan MOI NHAT duoc phep hoan tat va publish, khong con tranh chap thu tu.
concurrency:
  group: build-apk-release
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # CHI build & publish APK khi nguoi dung DA DONG Y - push binh thuong
    # (kem CI analyze/format/test) KHONG tu dong build APK nua. Claude chi
    # them "[build]" vao commit message khi nguoi dung yeu cau ro rang; nguoi
    # dung cung co the tu bam "Run workflow" (workflow_dispatch) bat cu luc nao.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Cache pub + Gradle giua cac lan chay - khong doi ket qua build, chi
      # tranh tai lai dependency (pub packages + Gradle/Android SDK
      # component) tu dau moi lan, giup rut ngan dang ke thoi gian build khi
      # pubspec.yaml/gradle files khong doi so voi lan chay truoc.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Giai ma keystore ky release (co dinh, giong may local)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > android/keystore/release.keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$(printf '%s' "$STORE_PW" | tr -d '\n\r')
          keyPassword=$(printf '%s' "$KEY_PW" | tr -d '\n\r')
          keyAlias=$(printf '%s' "$KEY_ALIAS" | tr -d '\n\r')
          storeFile=keystore/release.keystore.jks
          EOF

      - name: Giai ma google-services.json (push notification chat, bo qua neu chua setup)
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON_B64" ]; then
            printf '%s' "$GS_JSON_B64" | tr -d '\n\r' | base64 -d > android/app/google-services.json
          fi

      # --obfuscate --split-debug-info: tach thong tin debug (ten ham/bien
      # goc trong code Dart) ra khoi file APK thay vi nhung thang vao
      # libapp.so, giam duoc them dung luong ban release + kho doc nguoc code
      # hon - dung khuyen nghi chinh thuc cua Flutter cho ban production. File
      # symbol tach ra duoc luu lai o buoc "Upload debug symbols" ben duoi
      # (KHONG dong goi vao APK) - chi can den khi thuc su phai doc 1 crash
      # log native (hien app chua tich hop cong cu bao crash rieng).
      - name: Build release APK (universal, chi 2 kien truc ARM)
        # CHI build 1 ban duy nhat, khong con --split-per-abi rieng (yeu cau
        # nguoi dung 2026-09-04: don gian hoa, tranh nguoi tai nham file sai
        # kien truc khi sideload). Gop 2 kien truc ARM (arm64-v8a +
        # armeabi-v7a) vao 1 file APK duy nhat nen may nao cung cai duoc -
        # day la link tai duy nhat cho nguoi dung pho thong (xem
        # update_checker.dart va docs/ci-apk-distribution.md). CO Y bo
        # x86_64: kien truc do gan nhu chi ton tai tren may ao/emulator chu
        # khong co tren dien thoai that, loai no giam duoc ~1/3 dung luong.
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GG_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BUILD_SHA: ${{ github.sha }}
          GEMINI_DIRECT_KEY: ${{ secrets.GEMINI_API_KEY_DIRECT }}
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          CLEAN_URL=$(printf '%s' "$SB_URL" | tr -d '\n\r')
          CLEAN_ANON_KEY=$(printf '%s' "$SB_ANON_KEY" | tr -d '\n\r')
          CLEAN_CLIENT_ID=$(printf '%s' "$GG_CLIENT_ID" | tr -d '\n\r')
          CLEAN_GEMINI_KEY=$(printf '%s' "$GEMINI_DIRECT_KEY" | tr -d '\n\r')
          CLEAN_GIPHY_KEY=$(printf '%s' "$GIPHY_KEY" | tr -d '\n\r')
          flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols/universal --dart-define=SUPABASE_URL="$CLEAN_URL" --dart-define=SUPABASE_ANON_KEY="$CLEAN_ANON_KEY" --dart-define=GOOGLE_WEB_CLIENT_ID="$CLEAN_CLIENT_ID" --dart-define=BUILD_SHA="$BUILD_SHA" --dart-define=GEMINI_API_KEY_DIRECT="$CLEAN_GEMINI_KEY" --dart-define=GIPHY_API_KEY="$CLEAN_GIPHY_KEY"

      - name: Kiem tra dung luong APK (chan quy dinh cua library lam phinh app)
        run: |
          cd build/app/outputs/flutter-apk
          UNIVERSAL_WARN_MB=46
          UNIVERSAL_MAX_MB=60
          UNIVERSAL_SIZE_MB=$(du -m app-release.apk | cut -f1)
          echo "=== Dung luong APK (universal, arm64-v8a + armeabi-v7a) ==="
          echo "app-release.apk: ${UNIVERSAL_SIZE_MB}MB"
          if [ "$UNIVERSAL_SIZE_MB" -gt "$UNIVERSAL_MAX_MB" ]; then
            echo "::error::app-release.apk nang ${UNIVERSAL_SIZE_MB}MB, vuot qua muc toi da cho phep ${UNIVERSAL_MAX_MB}MB. Kiem tra dependency moi them (chay 'unzip -l' xem file .so nao lon bat thuong truoc khi merge) - vi du thuc te: google_mlkit_translation tung nhung rieng 1 file libtranslate_jni.so ~16MB khien APK nang gap doi."
            exit 1
          elif [ "$UNIVERSAL_SIZE_MB" -gt "$UNIVERSAL_WARN_MB" ]; then
            echo "::warning::app-release.apk nang ${UNIVERSAL_SIZE_MB}MB, vuot muc canh bao ${UNIVERSAL_WARN_MB}MB - chua chan build nhung nen xem lai dependency vua them co can thiet khong."
          fi

      - name: Upload debug symbols (de doc crash log native sau nay neu can)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: app/build/symbols
          retention-days: 90

      - name: Ghi commit SHA để app tự kiểm tra bản cập nhật
        run: |
          echo -n "${{ github.sha }}" > build/app/outputs/flutter-apk/version.txt
          # github.event.repository.updated_at la thoi gian METADATA chung
          # cua ca repo (khong chac chan gan voi lan push nay), tung khien
          # mo ta release nhin nhu "cu" du ban build that ra rat moi. Dung
          # gio thuc te cua chinh lan chay nay cho chinh xac.
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"

      - name: Publish to rolling "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Bản build mới nhất (tự động)"
          body: |
            Build tự động từ commit ${{ github.sha }} — ${{ github.event.head_commit.message || 'workflow_dispatch (bam thu cong)' }}
            Cập nhật lúc: ${{ env.BUILD_TIME_UTC }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/version.txt
          token: ${{ secrets.GITHUB_TOKEN }}

name: Build & Publish APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=BUILD_SHA=${{ github.sha }}

      - name: Ghi commit SHA để app tự kiểm tra bản cập nhật
        run: echo -n "${{ github.sha }}" > build/app/outputs/flutter-apk/version.txt

      - name: Publish to rolling "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Bản build mới nhất (tự động)"
          body: |
            Build tự động từ commit ${{ github.sha }} — ${{ github.event.head_commit.message }}
            Cập nhật lúc: ${{ github.event.repository.updated_at }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            app/build/app/outputs/flutter-apk/version.txt
          token: ${{ secrets.GITHUB_TOKEN }}

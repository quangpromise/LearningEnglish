name: Build & Publish APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # CHI build & publish APK khi nguoi dung DA DONG Y - push binh thuong
    # (kem CI analyze/format/test) KHONG tu dong build APK nua. Claude chi
    # them "[build]" vao commit message khi nguoi dung yeu cau ro rang; nguoi
    # dung cung co the tu bam "Run workflow" (workflow_dispatch) bat cu luc nao.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Giai ma keystore ky release (co dinh, giong may local)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r' | base64 -d > android/keystore/release.keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$(printf '%s' "$STORE_PW" | tr -d '\n\r')
          keyPassword=$(printf '%s' "$KEY_PW" | tr -d '\n\r')
          keyAlias=$(printf '%s' "$KEY_ALIAS" | tr -d '\n\r')
          storeFile=keystore/release.keystore.jks
          EOF

      - name: Build release APK (split per ABI, ban nho gon)
        env:
          # Dua secret qua bien moi truong (khong chen truc tiep ${{ }} vao
          # dong lenh) - neu secret bi dinh ky tu xuong dong thua luc paste,
          # cach nay van an toan vi gia tri chi duoc doc luc runtime, khong
          # bi GitHub thay the truc tiep vao noi dung script gay vo dong lenh.
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GG_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BUILD_SHA: ${{ github.sha }}
          # TAM THOI - xem ai_voice_chat/data/voice_chat_config.dart. Rong neu
          # chua tao secret GEMINI_API_KEY_DIRECT (tinh nang chi bao loi ket
          # noi, khong lam hong build).
          GEMINI_DIRECT_KEY: ${{ secrets.GEMINI_API_KEY_DIRECT }}
        run: |
          CLEAN_URL=$(printf '%s' "$SB_URL" | tr -d '\n\r')
          CLEAN_ANON_KEY=$(printf '%s' "$SB_ANON_KEY" | tr -d '\n\r')
          CLEAN_CLIENT_ID=$(printf '%s' "$GG_CLIENT_ID" | tr -d '\n\r')
          CLEAN_GEMINI_KEY=$(printf '%s' "$GEMINI_DIRECT_KEY" | tr -d '\n\r')
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL="$CLEAN_URL" --dart-define=SUPABASE_ANON_KEY="$CLEAN_ANON_KEY" --dart-define=GOOGLE_WEB_CLIENT_ID="$CLEAN_CLIENT_ID" --dart-define=BUILD_SHA="$BUILD_SHA" --dart-define=GEMINI_API_KEY_DIRECT="$CLEAN_GEMINI_KEY"

      - name: Build release APK (universal, chua tat ca kien truc)
        # Cac file --split-per-abi o tren doi hoi nguoi tai phai biet dung
        # kien truc chip cua may (arm64-v8a/armeabi-v7a/x86_64) - chon nham
        # file se bi Android tu choi cai voi loi "khong tuong thich". Ban
        # universal nay gop ca 3 kien truc vao 1 file APK duy nhat nen may
        # nao cung cai duoc, danh doi la dung luong lon hon - dung lam link
        # tai mac dinh cho nguoi dung pho thong (xem update_checker.dart va
        # docs/ci-apk-distribution.md).
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GG_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          BUILD_SHA: ${{ github.sha }}
          GEMINI_DIRECT_KEY: ${{ secrets.GEMINI_API_KEY_DIRECT }}
        run: |
          CLEAN_URL=$(printf '%s' "$SB_URL" | tr -d '\n\r')
          CLEAN_ANON_KEY=$(printf '%s' "$SB_ANON_KEY" | tr -d '\n\r')
          CLEAN_CLIENT_ID=$(printf '%s' "$GG_CLIENT_ID" | tr -d '\n\r')
          CLEAN_GEMINI_KEY=$(printf '%s' "$GEMINI_DIRECT_KEY" | tr -d '\n\r')
          flutter build apk --release --dart-define=SUPABASE_URL="$CLEAN_URL" --dart-define=SUPABASE_ANON_KEY="$CLEAN_ANON_KEY" --dart-define=GOOGLE_WEB_CLIENT_ID="$CLEAN_CLIENT_ID" --dart-define=BUILD_SHA="$BUILD_SHA" --dart-define=GEMINI_API_KEY_DIRECT="$CLEAN_GEMINI_KEY"

      - name: Kiem tra dung luong APK (chan quy dinh cua library lam phinh app)
        run: |
          cd build/app/outputs/flutter-apk
          WARN_MB=22
          MAX_MB=30
          FAILED=0
          echo "=== Dung luong APK theo kien truc (split-per-abi) ==="
          for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
            SIZE_MB=$(du -m "$f" | cut -f1)
            echo "$f: ${SIZE_MB}MB"
            if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
              echo "::error::$f nang ${SIZE_MB}MB, vuot qua muc toi da cho phep ${MAX_MB}MB. Kiem tra dependency moi them (chay 'unzip -l' xem file .so nao lon bat thuong truoc khi merge) - vi du thuc te: google_mlkit_translation tung nhung rieng 1 file libtranslate_jni.so ~16MB khien APK nang gap doi."
              FAILED=1
            elif [ "$SIZE_MB" -gt "$WARN_MB" ]; then
              echo "::warning::$f nang ${SIZE_MB}MB, vuot muc canh bao ${WARN_MB}MB - chua chan build nhung nen xem lai dependency vua them co can thiet khong."
            fi
          done
          # Ban universal gop ca 3 kien truc nen NANG HON HAN theo thiet ke -
          # dung nguong rieng cao hon nhieu, khong so sanh voi nguong split o tren.
          UNIVERSAL_WARN_MB=65
          UNIVERSAL_MAX_MB=85
          UNIVERSAL_SIZE_MB=$(du -m app-release.apk | cut -f1)
          echo "=== Dung luong APK universal (gop ca 3 kien truc) ==="
          echo "app-release.apk: ${UNIVERSAL_SIZE_MB}MB"
          if [ "$UNIVERSAL_SIZE_MB" -gt "$UNIVERSAL_MAX_MB" ]; then
            echo "::error::app-release.apk nang ${UNIVERSAL_SIZE_MB}MB, vuot qua muc toi da cho phep ${UNIVERSAL_MAX_MB}MB cho ban universal."
            FAILED=1
          elif [ "$UNIVERSAL_SIZE_MB" -gt "$UNIVERSAL_WARN_MB" ]; then
            echo "::warning::app-release.apk nang ${UNIVERSAL_SIZE_MB}MB, vuot muc canh bao ${UNIVERSAL_WARN_MB}MB."
          fi
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      - name: Ghi commit SHA để app tự kiểm tra bản cập nhật
        run: echo -n "${{ github.sha }}" > build/app/outputs/flutter-apk/version.txt

      - name: Publish to rolling "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Bản build mới nhất (tự động)"
          body: |
            Build tự động từ commit ${{ github.sha }} — ${{ github.event.head_commit.message }}
            Cập nhật lúc: ${{ github.event.repository.updated_at }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            app/build/app/outputs/flutter-apk/version.txt
          token: ${{ secrets.GITHUB_TOKEN }}

name: learn_english_music
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+42

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Phát nhạc thật (stream mp3 tự host) + đồng bộ lyric theo thời gian phát
  just_audio: ^0.9.42
  # Ghi âm + nhận diện giọng nói on-device cho tính năng luyện phát âm
  speech_to_text: ^7.0.0
  # Ghi lại file âm thanh thô để người dùng nghe lại chính giọng mình vừa
  # luyện (speech_to_text chỉ nhận diện văn bản, không lưu file audio)
  record: ^7.1.1
  # Ep lai audio session ve che do phat nhac (loa ngoai) truoc khi phat lai
  # ghi am - sau khi dung mic (record/speech_to_text), Android giu nguyen
  # audio mode cho ghi am nen AudioPlayer phat qua loa tai nghe rat nho,
  # nguoi dung tuong nhu "khong nghe duoc gi" du file ghi am hoan toan binh thuong.
  audio_session: ^0.1.21
  # Lưu lựa chọn giọng đọc TTS của người dùng trên máy (offline)
  shared_preferences: ^2.3.4
  # Lưu file mp3 tạm khi phát giọng đọc chất lượng cao (Google Cloud TTS)
  path_provider: ^2.1.6
  # Đọc version/build number thật từ APK đã cài, hiện ở màn Hồ sơ
  package_info_plus: ^10.2.1
  # Chọn ảnh từ thư viện/máy ảnh cho tính năng đặt Avatar
  image_picker: ^1.1.2
  # Phát âm mẫu bằng TTS gốc máy, offline, miễn phí
  flutter_tts: ^4.2.0
  # Quản lý state theo feature, thuận tiện khi nhiều người code song song
  flutter_riverpod: ^2.6.1
  # Backend tài khoản/điểm thưởng/phân quyền (Supabase: Auth + Postgres + Edge Functions)
  supabase_flutter: ^2.8.0
  # Đăng nhập bằng Google mail
  google_sign_in: ^6.2.2
  # Gọi GitHub API kiểm tra bản cập nhật (feature update checker); cũng dùng
  # gọi Free Dictionary API và MyMemory Translation API (miễn phí, không cần
  # key) cho tính năng tra từ/dịch — xem docs/research-translation-tts.md
  http: ^1.2.2
  # Mở link tải APK mới trong trình duyệt khi có bản cập nhật
  url_launcher: ^6.3.1
  # Mở trình cài đặt Android trực tiếp sau khi tải APK cập nhật xong (thay vì
  # để Chrome tự xử lý file .apk tải về)
  open_file: ^4.0.0
  # Ket noi WebSocket toi backend/gemini-proxy cho tinh nang AI Voice Chat -
  # goi chinh thuc cua dart.dev, khong phai thu vien ben thu 3 khong ro nguon.
  web_socket_channel: ^3.0.1
  # Thong bao nhac hoc tu vung theo lich (hoat dong ca khi app da dong/khoa
  # may) - MIT/BSD-style, mien phi, chay hoan toan on-device (khong goi API
  # nao) - xem docs/research-notifications.md.
  flutter_local_notifications: ^22.3.0
  # Phu thuoc bat buoc cua flutter_local_notifications cho lich hen gio
  # chinh xac (zonedSchedule) - Apache 2.0, mien phi, on-device.
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Sach public domain (het han ban quyen that su - xem ATTRIBUTION.md o
  # thu muc nay) tai truc tiep tu Project Gutenberg cho tinh nang Doc sach.
  # KHONG duoc them file sach nao khac vao day neu chua xac minh public
  # domain - xem quy tac ban quyen trong CLAUDE.md.
  assets:
    - assets/books/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Font bundle sẵn trong app (KHÔNG dùng google_fonts tải qua mạng lúc chạy —
  # gây chậm/giật lần đầu mở mỗi màn hình nếu mạng yếu). File variable font,
  # 1 file cho mọi độ đậm nhạt (weight).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

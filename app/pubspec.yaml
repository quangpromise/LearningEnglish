name: learn_english_music
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+96

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Phát nhạc thật (stream mp3 tự host) + đồng bộ lyric theo thời gian phát
  just_audio: ^0.9.42
  # Tich hop media session he thong (thong bao + man hinh khoa) cho just_audio
  # - hien ten bai/nghe si/logo app + nut Phat-Tam dung/Bai truoc/Bai sau ngay
  # ca khi app o nen/khoa may, khong can tu viet AudioHandler rieng. Mien phi,
  # mien nguon mo (MIT), chi bo sung tren nen just_audio da dung san.
  just_audio_background: ^0.0.1-beta.13
  # Da la dependency GIAN TIEP cua just_audio (transitive) - khai bao TRUC
  # TIEP o day vi main.dart can dung thang MethodChannelJustAudio de "cuu"
  # AudioPlayer khoi bi hong vinh vien neu JustAudioBackground.init() that
  # bai/timeout (xem comment trong main.dart).
  just_audio_platform_interface: ^4.6.0
  # Phat file audio NGAN (giong doc TTS cloud, phan hoi giong AI Voice Chat) -
  # BAT BUOC dung 1 goi KHAC just_audio cho 2 tinh nang nay, vi
  # just_audio_background.dart tu gioi han cung "supports only a single
  # player instance" (xem source that: neu AudioPlayer() thu 2 cua just_audio
  # duoc tao sau khi JustAudioBackground.init() da chay, no nem
  # PlatformException ngay lap tuc, bi nuot lang le boi try/catch, gay ra bug
  # "im tieng" tuy thuoc thu tu dung tinh nang nao truoc). audioplayers la 1
  # plugin HOAN TOAN TACH BIET (khong di qua JustAudioPlatform.instance) nen
  # khong bi anh huong. Mien phi, mien nguon mo (MIT).
  audioplayers: ^6.1.0
  # Ghi âm + nhận diện giọng nói on-device cho tính năng luyện phát âm
  speech_to_text: ^7.0.0
  # Ghi lại file âm thanh thô để người dùng nghe lại chính giọng mình vừa
  # luyện (speech_to_text chỉ nhận diện văn bản, không lưu file audio)
  record: ^7.1.1
  # Ep lai audio session ve che do phat nhac (loa ngoai) truoc khi phat lai
  # ghi am - sau khi dung mic (record/speech_to_text), Android giu nguyen
  # audio mode cho ghi am nen AudioPlayer phat qua loa tai nghe rat nho,
  # nguoi dung tuong nhu "khong nghe duoc gi" du file ghi am hoan toan binh thuong.
  audio_session: ^0.1.21
  # Lưu lựa chọn giọng đọc TTS của người dùng trên máy (offline)
  shared_preferences: ^2.3.4
  # Lưu file mp3 tạm khi phát giọng đọc chất lượng cao (Google Cloud TTS)
  path_provider: ^2.1.6
  # Đọc version/build number thật từ APK đã cài, hiện ở màn Hồ sơ
  package_info_plus: ^10.2.1
  # Chọn ảnh từ thư viện/máy ảnh cho tính năng đặt Avatar + gửi ảnh trong chat
  image_picker: ^1.1.2
  # Chọn file bất kỳ (PDF, tài liệu...) để gửi trong chat - miễn phí, mã
  # nguồn mở (BSD-3), không có API tương đương trong image_picker.
  file_picker: ^12.1.2
  # Phát âm mẫu bằng TTS gốc máy, offline, miễn phí
  flutter_tts: ^4.2.0
  # Quản lý state theo feature, thuận tiện khi nhiều người code song song
  flutter_riverpod: ^2.6.1
  # Backend tài khoản/điểm thưởng/phân quyền (Supabase: Auth + Postgres + Edge Functions)
  supabase_flutter: ^2.8.0
  # Đăng nhập bằng Google mail
  google_sign_in: ^6.2.2
  # Gọi GitHub API kiểm tra bản cập nhật (feature update checker); cũng dùng
  # gọi Free Dictionary API và MyMemory Translation API (miễn phí, không cần
  # key) cho tính năng tra từ/dịch — xem docs/research-translation-tts.md
  http: ^1.2.2
  # Mở link tải APK mới trong trình duyệt khi có bản cập nhật
  url_launcher: ^6.3.1
  # Mở trình cài đặt Android trực tiếp sau khi tải APK cập nhật xong (thay vì
  # để Chrome tự xử lý file .apk tải về)
  open_file: ^4.0.0
  # Ket noi WebSocket toi backend/gemini-proxy cho tinh nang AI Voice Chat -
  # goi chinh thuc cua dart.dev, khong phai thu vien ben thu 3 khong ro nguon.
  web_socket_channel: ^3.0.1
  # Thong bao nhac hoc tu vung theo lich (hoat dong ca khi app da dong/khoa
  # may) - MIT/BSD-style, mien phi, chay hoan toan on-device (khong goi API
  # nao) - xem docs/research-notifications.md.
  flutter_local_notifications: ^22.3.0
  # Phu thuoc bat buoc cua flutter_local_notifications cho lich hen gio
  # chinh xac (zonedSchedule) - Apache 2.0, mien phi, on-device.
  timezone: ^0.11.1
  # Push notification tin nhan chat khi app da dong/khoa may (khac voi
  # flutter_local_notifications o tren - cai do chi lich SAN, con tin nhan
  # den bat ky luc nao nen can server chu dong "danh thuc" may qua FCM) -
  # Apache 2.0, mien phi khong gioi han so luong push - xem
  # docs/setup-firebase-chat-push.md.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Ve bieu do gia (crypto/chung khoan) - MIT, mien phi, chi ve UI thuan tuy
  # (khong tu goi API nao) nen khong anh huong den nguon du lieu da chon.
  # ^1.0.0 (khong phai 0.69 truoc day) vi CandlestickChart (nen xanh/do kieu
  # OKX) chi co tu fl_chart 1.0.0 tro len.
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Tu dong sinh icon app (Android/iOS/Web) tu 1 file anh nguon duy nhat -
  # chi dung 1 lan de build lai icon, khong phai dependency luc chay app.
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Am "ding" bao tin nhan moi - tu tong hop bang script (2 nguyen am sin
  # 880Hz/1318Hz), KHONG lay tu nguon nhac ben ngoai nao nen khong dinh van
  # de ban quyen. File giong het duoc copy sang android/app/src/main/res/raw/
  # de dung lam am thanh cho notification channel he thong (xem chat_push.dart).
  #
  # Sach public domain (het han ban quyen that su - xem ATTRIBUTION.md o
  # thu muc nay) tai truc tiep tu Project Gutenberg cho tinh nang Doc sach.
  # KHONG duoc them file sach nao khac vao day neu chua xac minh public
  # domain - xem quy tac ban quyen trong CLAUDE.md.
  assets:
    - assets/audio/
    - assets/books/
    - assets/icon/
    - assets/fitness/
    - assets/fitness/muscle_groups/
    - assets/fitness/exercise_photos/
    - assets/home/
    - assets/wealth/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Font bundle sẵn trong app (KHÔNG dùng google_fonts tải qua mạng lúc chạy —
  # gây chậm/giật lần đầu mở mỗi màn hình nếu mạng yếu). File variable font,
  # 1 file cho mọi độ đậm nhạt (weight).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Cau hinh cho flutter_launcher_icons (goi `dart run flutter_launcher_icons`
# sau khi doi anh nguon assets/icon/app_icon_square.png de sinh lai icon).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_square.png"
  min_sdk_android: 21
  # Anh foreground rieng (assets/icon/adaptive_icon_foreground.png) - noi dung
  # da duoc thu nho ve 66% + can giua tren nen trong suot de KHONG bi cham boi
  # vien tron/squircle cua Android 8+ (anh vuong goc dau nghe/ta sat mep se bi
  # cat mat neu dung truc tiep). background dung mau navy giong nen goc cua
  # icon (#0B1E4D, cung mau dung cho web) - truoc day de trong ca 2 muc nay,
  # khien Android tu chen 1 khung nen TRANG + le quanh icon cu (nhin nhu "co
  # vien trang") thay vi fill kin nhu thiet ke.
  adaptive_icon_foreground: "assets/icon/adaptive_icon_foreground.png"
  adaptive_icon_background: "#0B1E4D"
  web:
    generate: true
    image_path: "assets/icon/app_icon_square.png"
    background_color: "#0B1E4D"
    theme_color: "#0B1E4D"

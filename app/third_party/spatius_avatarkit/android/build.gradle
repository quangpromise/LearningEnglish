// VA: BO khoi buildscript{} rieng cua plugin nay (ban goc keo
// com.android.tools.build:gradle:8.9.1 + kotlin-gradle-plugin 2.1.0). Project
// goc dung AGP 9.1.0 / Kotlin 2.4.0 tren Gradle 9.3.1; nap them 1 classpath
// AGP 8.9.1 vao cung 1 build lam Gradle 9 nem
//   "java.lang.NullPointerException (no error message)" ngay khi giai
// phu thuoc kotlin-stdlib 2.1.0 -> BUILD FAILED o task assembleRelease (loi
// CI 2026-09-19, khong bat duoc bang flutter analyze vi day la tang Gradle).
//
// Cach dung hien nay: khai bao qua plugins{} KHONG kem version - version lay
// tu pluginManagement trong app/android/settings.gradle.kts, nho vay module
// nay luon di cung phien ban AGP/Kotlin cua project goc thay vi ghim rieng 1
// bo cu hon. Repositories cung do settings.gradle.kts khai bao chung.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "ai.spatius.avatarkit"
version = "1.0-SNAPSHOT"


android {
    // VA: doi namespace cua module WRAPPER Flutter nay (khac voi AAR native
    // "ai.spatius:avatarkit:1.3.4" no phu thuoc ben duoi, dependencies{} o
    // duoi) - ban goc pub.dev 1.3.6 dat CUNG 1 namespace "ai.spatius.avatarkit"
    // cho ca 2, khien AGP 8+/9 bao loi "Namespace ... is used in multiple
    // modules and/or libraries" (build that tren CI, khong bat duoc bang
    // flutter analyze vi day la loi merge AndroidManifest luc build native,
    // khong phai loi Dart). Doi ten wrapper thanh hau to ".flutterplugin" -
    // KHONG anh huong code Kotlin trong src/ (namespace AGP chi dung de sinh
    // R/BuildConfig, khong doi package khai bao trong file .kt).
    namespace = "ai.spatius.avatarkit.flutterplugin"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }


    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    dependencies {
        // SPAvatarKit SDK (published to mavenLocal or mavenCentral)
        implementation("ai.spatius:avatarkit:1.3.4")

        // Coroutines
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// jvmTarget khai bao o cap goc qua kotlin{} - khoi kotlinOptions{} ben trong
// android{} da bi go o Kotlin 2.x/AGP 9 (chinh la cach app/build.gradle.kts
// cua project goc dang lam).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

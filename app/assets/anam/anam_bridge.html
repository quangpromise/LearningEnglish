<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Anam Live Avatar Bridge</title>
<style>
  /* Video WebRTC tran toan man hinh, an moi control mac dinh - Anam SDK
     khong tu ve control nao len tren <video>, nhung de phong SDK doi API va
     tu ve them UI rieng trong tuong lai, khoa cung object-fit/pointer-events
     o day luon. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #anam-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    pointer-events: none;
  }
  #anam-video::-webkit-media-controls {
    display: none !important;
  }
</style>
</head>
<body>
  <!-- KHONG duoc dat thuoc tinh "muted" tren the nay du kem gia tri gi -
       muted la boolean attribute cua HTML: CHI CAN CO MAT la video bi cam
       tieng, bat ke ghi muted="false" hay muted="0". Day chinh la nguyen
       nhan goc cua bug "avatar map may moi nhung khong ra tieng" - stream
       WebRTC tra ve tu Anam (audio passthrough) da mang san am thanh dong
       bo voi video (xem streamToVideoElement/createAgentAudioInputStream
       trong docs Anam), chi can KHONG bi mute la nghe duoc, khong can tu
       dung Web Audio API phat lai rieng (da bo hoan toan lop do - vua thua
       vua la nguon xung dot/tre tiem an). mediaPlaybackRequiresUserGesture
       da tat o phia Dart (anam_live_avatar.dart) nen video co the tu phat
       ca tieng lan hinh ma khong can nguoi dung cham vao man hinh truoc. -->
  <video id="anam-video" autoplay playsinline></video>

  <script type="module">
    // Ban ESM build cua @anam-ai/js-sdk qua jsdelivr +esm (tu dong bundle
    // dependency noi bo) - KHONG can npm/bundler rieng, phu hop nhung file
    // HTML tinh nam trong assets Flutter. Ghim version ro rang, kiem tra lai
    // https://www.npmjs.com/package/@anam-ai/js-sdk neu can nang cap.
    import { createClient, AnamEvent } from 'https://cdn.jsdelivr.net/npm/@anam-ai/js-sdk@4.27.0/+esm';

    const VIDEO_ELEMENT_ID = 'anam-video';
    // Dinh dang audio Gemini Live tra ve (PCM 16-bit, mono, 24kHz - xem
    // GeminiLiveDirectClient._outputSampleRate ben Dart) - khai bao dung
    // sampleRate nay de Anam KHONG can ta resample truoc, tranh mat them do
    // tre + rui ro lech dong bo tieng/hinh.
    const AUDIO_ENCODING = 'pcm_s16le';
    const AUDIO_SAMPLE_RATE = 24000;
    const AUDIO_CHANNELS = 1;

    let anamClient = null;
    let audioInputStream = null;
    const videoEl = document.getElementById(VIDEO_ELEMENT_ID);
    // true chi trong luc chinh window.stopAnam() dang dong ket noi CHU DINH
    // (roi man hinh, dispose Widget...) - CONNECTION_CLOSED nhan duoc luc do
    // KHONG duoc coi la "phien het han ngoai y muon", tranh vong lap goi
    // fetchNewAnamToken()/restartAnamSession vo ich sau khi nguoi dung da
    // chu dong thoat.
    let intentionalStop = false;

    /** Bao trang thai/loi ve phia Flutter qua channel cua flutter_inappwebview
     *  (dang ky bang controller.addJavaScriptHandler('anamEvent', ...) ben
     *  Dart - xem anam_live_avatar.dart). */
    function notifyFlutter(type, detail) {
      try {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('anamEvent', type, detail ?? null);
        }
      } catch (e) {
        // Khong co cau moi (vd dang mo file nay truc tiep tren trinh duyet
        // thuong de test) - bo qua, khong lam gian doan luong avatar.
      }
    }

    // ID avatar dang active - CHI de bookkeeping/log ben JS, KHONG duoc
    // dung de chon avatar: danh tinh avatar Anam da duoc "khoa" san trong
    // sessionToken tu luc mint o server (personaConfig.avatarId khi goi
    // AnamSessionApi.fetchSessionToken/fetchSessionTokenFromProxy), createClient()
    // ben duoi KHONG nhan avatarId rieng. Tham so [avatarId] o day ton tai
    // de code Dart goi initAnam/restartAnamSession doi xung voi Spatius
    // (initSpatiusAvatarSession) - xem AnamLiveAvatar._connect.
    let activeAvatarId = null;

    /** Flutter goi ham nay 1 lan sau khi doi duoc sessionToken tu
     *  AnamSessionApi.fetchSessionToken (xem anam_session_api.dart) - KHONG
     *  bao gio truyen API key that vao day, chi truyen session token ngan
     *  han. [avatarId] chi de log - xem khai bao activeAvatarId o tren. */
    window.initAnam = async function initAnam(sessionToken, avatarId) {
      try {
        if (anamClient) {
          await window.stopAnam();
        }
        intentionalStop = false;
        activeAvatarId = avatarId ?? null;

        anamClient = createClient(sessionToken, {
          // Tat mic cua chinh WebView - nguoi dung da noi qua mic that o
          // tang Flutter (record package), Anam KHONG duoc tu xin quyen mic
          // rieng trong WebView nua vi se dam voi nhau. Bo qua duoc luon
          // buoc xin quyen mic cua trinh duyet (von gay tre dang ke luc
          // khoi dong) vi flag nay tat hoan toan input audio cua Anam.
          disableInputAudio: true,
          // sessionOptions.videoQuality: "high" (MAC DINH cua Anam) moi la
          // che do ep bitrate cao nhat NGAY TU DAU (khong ramp-up dan) -
          // "auto" nguoc lai la che do ABR, TU TANG DAN bitrate tu thap len
          // cao. Doi voi muc tieu "thay khung hinh dau tien nhanh nhat"
          // (time-to-first-frame) tren mang di dong khong on dinh, "auto"
          // thuc te thuong NHANH HON vi khong phai cho dam phan/dem du bang
          // thong cho bitrate cao truoc khi hien frame nao - danh doi la
          // frame dau co the hoi mo, net dan len sau vai giay.
          sessionOptions: {
            videoQuality: 'auto',
          },
        });

        // Goi Free cua Anam tu dong dong phien sau 1 khoang thoi gian nhat
        // dinh (maxSessionLengthSeconds dat trong
        // anam_vercel_server/api/main.py, mac dinh 180s) - CONNECTION_CLOSED
        // se bao hieu luc do. Bao ngay ve Flutter qua 1 handler RIENG
        // ('anamSessionExpired', khac voi kenh 'anamEvent' dung cho
        // ready/error) de Flutter tu xin token moi + goi lai initAnam(),
        // khong can nguoi dung tu mo lai man hinh.
        anamClient.addListener(AnamEvent.CONNECTION_CLOSED, (reason, details) => {
          if (intentionalStop) return;
          try {
            if (window.flutter_inappwebview) {
              window.flutter_inappwebview.callHandler(
                'anamSessionExpired',
                String(reason ?? ''),
                details ? String(details) : null,
              );
            }
          } catch (e) {
            // Bo qua - khong co cau moi de bao.
          }
        });

        // Bao Flutter biet khung hinh dau tien THUC SU da hien de an anh
        // tinh che WebView (xem AnamLiveAvatar/ai_voice_chat_screen.dart) -
        // dung VIDEO_PLAY_STARTED (frame that su bat dau phat) thay vi
        // CONNECTION_ESTABLISHED (chi la WebRTC da noi xong, co the xay ra
        // TRUOC khi co frame nao render, an anh tinh luc do se lo ra 1
        // khoang den/trong ngan truoc khi video that su xuat hien).
        anamClient.addListener(AnamEvent.VIDEO_PLAY_STARTED, () => {
          try {
            if (window.flutter_inappwebview) {
              window.flutter_inappwebview.callHandler('avatarReady');
            }
          } catch (e) {
            // Bo qua - khong co cau moi de bao.
          }
        });

        await anamClient.streamToVideoElement(VIDEO_ELEMENT_ID);
        // Dam bao thuoc tinh muted THAT SU la false tren DOM property (khac
        // voi HTML attribute) - phong truong hop trinh duyet/SDK tu dat lai
        // muted=true sau khi gan srcObject (mot so browser mac dinh mute
        // video moi de duoc phep autoplay, roi cho code tu bo mute sau khi
        // xac nhan duoc phep phat co tieng - o day da tat yeu cau gesture
        // qua mediaPlaybackRequiresUserGesture:false nen bo duoc ngay).
        if (videoEl) {
          videoEl.muted = false;
          videoEl.volume = 1.0;
          // play() co the bi tu choi neu WebView van ap dung autoplay
          // policy rieng - thu goi lai 1 lan, bo qua loi neu co (video van
          // tu autoplay duoc nho attribute autoplay trong da so truong hop).
          videoEl.play().catch(() => {});
        }

        audioInputStream = anamClient.createAgentAudioInputStream({
          encoding: AUDIO_ENCODING,
          sampleRate: AUDIO_SAMPLE_RATE,
          channels: AUDIO_CHANNELS,
        });

        notifyFlutter('ready');
      } catch (e) {
        notifyFlutter('error', String(e && e.message ? e.message : e));
      }
    };

    /** Nhan 1 doan audio Gemini Live (PCM16 24kHz mono, ma hoa base64) tu
     *  tang Flutter va nap thang vao mieng avatar de lipsync realtime - goi
     *  lai lien tuc, cang nhieu chunk nho cang giam do tre. KHONG tu phat
     *  lai am thanh o day - video WebRTC (streamToVideoElement o tren) da
     *  tu mang san audio dong bo voi lipsync, tu phat rieng qua Web Audio
     *  API se tao ra 2 nguon tieng ganh nhau (hoac ca 2 cung khong phat
     *  duoc do tranh chap AudioContext) - day chinh la nguyen nhan bug
     *  "avatar map may moi nhung khong nghe tieng" truoc do. */
    window.sendGeminiStreamToAnam = function sendGeminiStreamToAnam(audioChunkBase64) {
      if (!audioInputStream || !audioChunkBase64) return;
      try {
        const binary = atob(audioChunkBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        audioInputStream.sendAudioChunk(bytes);
      } catch (e) {
        notifyFlutter('error', 'sendAudioChunk: ' + String(e && e.message ? e.message : e));
      }
    };

    /** Flutter goi khi nguoi dung bat dau noi de ngat loi (barge-in) - xoa
     *  ngay hang doi audio dang cho lipsync/phat, tranh avatar noi de len
     *  loi nguoi dung dang noi. */
    window.interruptPersona = function interruptPersona() {
      try {
        if (anamClient && typeof anamClient.interruptPersona === 'function') {
          anamClient.interruptPersona();
        }
        if (audioInputStream && typeof audioInputStream.endSequence === 'function') {
          audioInputStream.endSequence();
        }
        notifyFlutter('interrupted');
      } catch (e) {
        notifyFlutter('error', 'interruptPersona: ' + String(e && e.message ? e.message : e));
      }
    };

    /** Flutter goi khi Gemini Live bao 1 luot AI noi da xong (turnComplete) -
     *  bao Anam biet khong con audio nao them cho cau tra loi nay, de no
     *  ngung cho/flush buffer lipsync dung luc thay vi treo mieng cho hoai. */
    window.endAnamTurn = function endAnamTurn() {
      try {
        audioInputStream && audioInputStream.endSequence();
      } catch (e) {
        notifyFlutter('error', 'endSequence: ' + String(e && e.message ? e.message : e));
      }
    };

    /** Dong hoan toan phien WebRTC - goi khi roi man AI Voice Chat hoac dispose
     *  Widget. */
    window.stopAnam = async function stopAnam() {
      intentionalStop = true;
      try {
        await anamClient?.stopStreaming();
      } catch (e) {
        // Bo qua loi luc dong - khong quan trong bang viec dam bao chay xong.
      } finally {
        anamClient = null;
        audioInputStream = null;
      }
    };

    /** Ten goi tu Flutter khi can noi lai - hoac sau khi phien cu bi Anam tu
     *  dong dong (CONNECTION_CLOSED, xem tren), hoac khi nguoi dung doi giong
     *  Gemini Live sang gioi tinh khac (xem AiVoiceChatScreen._onVoiceChanged)
     *  - thuc chat CHINH LA initAnam(sessionToken, avatarId), vi SDK Anam
     *  KHONG co API "resume/reconnect" rieng, cach dung dung la tao lai
     *  client hoan toan tu 1 session token moi (xem docs.anam.ai/
     *  sdk-reference/events - khong co client.start()/reconnect() nao duoc
     *  cong bo). Dat alias rieng ten de code Dart goi cho ro nghia, khong
     *  phai vi hanh vi khac initAnam. */
    window.restartAnamSession = window.initAnam;

    notifyFlutter('script_loaded');
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <script>
    // VA cho 1 bug that su cua ENGINE Flutter Web (khong phai loi code app -
    // xem flutter/flutter#175074 va #179438, anh huong TAT CA man hinh co
    // TextField tren trinh duyet mobile, dac biet Android Chrome): sau khi
    // mo ban phim roi dong lai, man hinh bi "ket" o kich thuoc da co lai
    // theo ban phim, khong tu gian lai du ban phim da bien mat that su - vi
    // CanvasKit/Skwasm renderer chi tinh lai layout khi nhan duoc 1 su kien
    // 'resize' MOI cua window, ma trinh duyet khong luon tu ban resize do
    // lai dung luc ban phim dong. Rieng truong hop dong ban phim bang CU CHI
    // BACK cua he thong (khac voi cham ra ngoai/nut Done) con bi NANG hon
    // (xem #179438) vi visualViewport bao chieu cao thay doi tre/khong on
    // dinh - nen ngoai theo doi visualViewport, con nghe them su kien
    // 'focusout' toan cuc (input DOM mat focus NGAY LAP TUC bat ke dong ban
    // phim bang cach nao) lam tin hieu kich hoat thu 2, dang tin cay hon.
    //
    // Fix, khi phat hien ban phim vua dong that su (chieu cao hien tai gan
    // bang chieu cao day du ghi nhan 1 LAN DUY NHAT luc trang vua tai, truoc
    // khi ban phim tung mo, VA hien khong con o INPUT/TEXTAREA nao dang giu
    // focus - xem guard trong maybeRecalc(), BAT BUOC de tranh interupt luc
    // 1 o vua duoc autofocus dang cho ban phim mo len):
    //  1. Dua scroll cua trang ve (0,0) - trinh duyet đôi khi giu nguyen vi
    //     tri scroll da nhay len luc ban phim mo, khien Flutter lech toa do.
    //  2. "Rung" nhe khung ve chinh (flt-glass-pane) 1px roi tra ve ngay +
    //     tu ban 1 su kien 'resize' - ep renderer tinh lai layout dung kich
    //     thuoc thuc te, thay vi cho 1 tuong tac ngau nhien khac cua nguoi
    //     dung (cham/cuon) tinh co kich hoat lai.
    // Lam lai nhieu lan voi do tre tang dan vi Chrome Android doi luc bao
    // muon hon Flutter kip xu ly.
    (function () {
      if (!window.visualViewport) return;
      var vv = window.visualViewport;
      var fullHeight = window.innerHeight;
      var recalcRunning = false;

      function forceRecalc() {
        var glassPane = document.querySelector('flt-glass-pane');
        if (glassPane) {
          glassPane.style.width = 'calc(100% - 1px)';
          glassPane.style.height = 'calc(100% - 1px)';
          void glassPane.offsetHeight; // Ep reflow ngay lap tuc.
          window.dispatchEvent(new Event('resize'));
          requestAnimationFrame(function () {
            glassPane.style.width = '100%';
            glassPane.style.height = '100%';
            window.dispatchEvent(new Event('resize'));
          });
        }
        window.scrollTo(0, 0);
        // KHONG con tu blur() o dang focus o day nua - day chinh la nguyen
        // nhan gay bug MOI "khong mo duoc ban phim" o man Dich/Writing >
        // Doan van (ca 2 deu autofocus:true): ngay luc autofocus vua chiem
        // focus, trinh duyet phat sinh 1 su kien 'focusout' "gia" tu phan tu
        // truoc do trong luc ban phim CHUA KIP mo (vv.height con gan full),
        // khien maybeRecalc() tuong nham "ban phim vua dong" va tu blur()
        // luon o VUA MOI duoc autofocus, ban phim khong bao gio hien ra
        // duoc. Xem guard o maybeRecalc() thay the: chi chay khi THAT SU
        // khong con o nao dang focus.
      }

      // Lam lai nhieu lan voi do tre tang dan (thay vi chi 3 moc co dinh
      // nhu truoc) - gop chung 1 ham cho ca 2 nguon kich hoat (visualViewport
      // VA focusout) de tranh chay trung lap chong cheo nhau.
      function scheduleRecalc() {
        if (recalcRunning) return;
        recalcRunning = true;
        [0, 100, 250, 450, 700, 1000].forEach(function (delay, i, arr) {
          setTimeout(function () {
            forceRecalc();
            if (delay === arr[arr.length - 1]) recalcRunning = false;
          }, delay);
        });
      }

      function maybeRecalc() {
        // Chi coi la "ban phim da dong" khi CA 2 dieu kien: (a) chieu cao
        // hien tai gan bang chieu cao day du ghi nhan luc dau, VA (b) hien
        // KHONG co o INPUT/TEXTAREA nao dang giu focus - neu con 1 o dang
        // focus (vd vua duoc autofocus, ban phim co the dang tren duong mo
        // len nhung trinh duyet chua kip thu nho vv.height) thi TUYET DOI
        // khong dong vao gi ca, tranh interupt luc nguoi dung/app dang can
        // mo ban phim that su.
        var active = document.activeElement;
        var stillFocused =
          active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
        if (!stillFocused && vv.height >= fullHeight - 60) scheduleRecalc();
      }

      vv.addEventListener('resize', maybeRecalc);
      vv.addEventListener('scroll', maybeRecalc);
      // focusout: bat duoc NGAY thoi diem 1 o nhap mat focus (ca khi dong
      // ban phim bang cu chi back), khong can doi visualViewport bao ve sau.
      window.addEventListener(
        'focusout',
        function () {
          setTimeout(maybeRecalc, 250);
          setTimeout(maybeRecalc, 500);
        },
        true
      );
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <!--
    KHONG dat <meta name="viewport"> o day: engine Flutter Web tu XOA moi
    the viewport co san va thay bang the cua no luc khoi dong (xem
    full_page_embedding_strategy.dart _applyViewportMeta trong SDK) - cac
    lan truoc doi interactive-widget o day deu KHONG co tac dung gi.

    Nguyen nhan THAT cua bug "mo ban phim o Dich/Writing > Doan van thi man
    hinh ket, nen trang, khong keo duoc" (xac dinh qua anh chup tu iPhone):
    tren iOS moi trinh duyet deu la WebKit, ma WebKit TU PHONG TO trang khi
    focus 1 o nhap co co chu < 16px va KHONG tu thu nho lai sau khi dong ban
    phim. Engine Flutter chep nguyen co chu cua TextField vao o <input> an
    (Dich 14px, Doan van 14.5px -> bi phong to; Writing > Tu vung 16px ->
    khong bi), con meta viewport cua engine lai cho phep phong to toi 5x va
    khoa thao tac cham (touch-action: none) nen khong keo/thu nho lai duoc.

    Sua: tren iOS, doi meta viewport ma engine vua chen thanh
    maximum-scale=1.0 - chan WebKit tu phong to khi focus o nhap (iOS 10+
    van cho nguoi dung chum 2 ngon phong to neu can, nen khong vi pham
    kha nang tiep can). Chi dong vao dung thuoc tinh content cua the meta,
    khong dong focus/scroll/style DOM nao khac.
  -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;
      var CONTENT = 'width=device-width, initial-scale=1.0, maximum-scale=1.0';
      function patchAll() {
        var metas = document.head.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          if (metas[i].getAttribute('content') !== CONTENT) {
            metas[i].setAttribute('content', CONTENT);
          }
        }
      }
      // Engine xoa the viewport cu va chen the moi cua no luc khoi dong
      // (full_page_embedding_strategy.dart _applyViewportMeta) - theo doi
      // de sua lai ngay khi no chen.
      new MutationObserver(patchAll).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['content'],
      });
      patchAll();
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

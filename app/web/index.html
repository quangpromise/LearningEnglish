<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <script>
    // VA cho 1 bug that su cua ENGINE Flutter Web (khong phai loi code app -
    // xem flutter/flutter#175074, anh huong TAT CA man hinh co TextField
    // tren trinh duyet mobile, dac biet Android Chrome): sau khi mo ban phim
    // roi dong lai (nut back he thong, nut Done, hay bam ra ngoai), man hinh
    // bi "ket" o kich thuoc da co lai theo ban phim, khong tu gian lai du
    // ban phim da bien mat that su - vi CanvasKit/Skwasm renderer chi tinh
    // lai layout khi nhan duoc 1 su kien 'resize' MOI cua window, ma trinh
    // duyet khong luon tu bien resize do lai dung luc ban phim dong.
    //
    // Fix: theo doi window.visualViewport (API chuan phat hien chieu cao
    // thuc te con lai sau khi ban phim choan cho) - khi chieu cao TANG DOT
    // NGOT (>100px, dau hieu ban phim vua dong), chu dong:
    //  1. Dua scroll cua trang ve (0,0) - trinh duyet đôi khi giu nguyen vi
    //     tri scroll da nhay len luc ban phim mo, khien Flutter lech toa do.
    //  2. Bo focus khoi input DOM dang giu (neu con) - bao Flutter biet
    //     khong con can cho ban phim nua.
    //  3. "Rung" nhe khung ve chinh (flt-glass-pane) 1px roi tra ve ngay +
    //     tu ban 1 su kien 'resize' - ep renderer tinh lai layout dung kich
    //     thuoc thuc te, thay vi cho 1 tuong tac ngau nhien khac cua nguoi
    //     dung (cham/cuon) tinh co kich hoat lai.
    // Lam lai vai lan voi do tre khac nhau vi Chrome Android doi luc bao
    // muon hon Flutter kip xu ly.
    (function () {
      if (!window.visualViewport) return;
      var vv = window.visualViewport;
      var maxHeight = vv.height;
      var lastHeight = vv.height;

      function forceRecalc() {
        var glassPane = document.querySelector('flt-glass-pane');
        if (glassPane) {
          glassPane.style.width = 'calc(100% - 1px)';
          glassPane.style.height = 'calc(100% - 1px)';
          void glassPane.offsetHeight; // Ep reflow ngay lap tuc.
          window.dispatchEvent(new Event('resize'));
          requestAnimationFrame(function () {
            glassPane.style.width = '100%';
            glassPane.style.height = '100%';
            window.dispatchEvent(new Event('resize'));
          });
        }
        window.scrollTo(0, 0);
        var active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
          active.blur();
        }
      }

      vv.addEventListener('resize', function () {
        var diff = vv.height - lastHeight;
        // Ban phim vua dong: chieu cao "hien" tang manh VA da gan bang muc
        // cao nhat tung ghi nhan (tranh nham lan voi luc ban phim MO ra it -
        // truong hop do chieu cao GIAM, khong vao nhanh nay).
        if (diff > 100 && vv.height >= maxHeight - 50) {
          forceRecalc();
          setTimeout(forceRecalc, 100);
          setTimeout(forceRecalc, 250);
        }
        if (vv.height > maxHeight) maxHeight = vv.height;
        lastHeight = vv.height;
      });
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

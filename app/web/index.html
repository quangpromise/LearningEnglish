<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <script>
    // VA cho 1 bug that su cua ENGINE Flutter Web (khong phai loi code app -
    // xem flutter/flutter#175074 va #179438, anh huong TAT CA man hinh co
    // TextField tren trinh duyet mobile, dac biet Android Chrome): sau khi
    // mo ban phim roi dong lai, man hinh bi "ket" o kich thuoc da co lai
    // theo ban phim, khong tu gian lai du ban phim da bien mat that su - vi
    // CanvasKit/Skwasm renderer chi tinh lai layout khi nhan duoc 1 su kien
    // 'resize' MOI cua window, ma trinh duyet khong luon tu ban resize do
    // lai dung luc ban phim dong. Rieng truong hop dong ban phim bang CU CHI
    // BACK cua he thong (khac voi cham ra ngoai/nut Done) con bi NANG hon
    // (xem #179438) vi visualViewport bao chieu cao thay doi tre/khong on
    // dinh - nen ngoai theo doi visualViewport, con nghe them su kien
    // 'focusout' toan cuc (input DOM mat focus NGAY LAP TUC bat ke dong ban
    // phim bang cach nao) lam tin hieu kich hoat thu 2, dang tin cay hon.
    //
    // Fix, khi phat hien ban phim vua dong that su:
    //  1. Dua scroll cua trang ve (0,0) - trinh duyet đôi khi giu nguyen vi
    //     tri scroll da nhay len luc ban phim mo, khien Flutter lech toa do.
    //  2. "Rung" nhe khung ve chinh (flt-glass-pane) 1px roi tra ve ngay +
    //     tu ban 1 su kien 'resize' - ep renderer tinh lai layout dung kich
    //     thuoc thuc te, thay vi cho 1 tuong tac ngau nhien khac cua nguoi
    //     dung (cham/cuon) tinh co kich hoat lai.
    //
    // CHU Y quan trong (rut kinh nghiem tu 2 lan sua truoc lam hong ban
    // phim o man Dich/Writing): CHI dung 1 hen gio DUY NHAT, doi ON DINH
    // [_settleDelay] KHONG co gi thay doi them roi moi thuc su dong vao DOM,
    // VA kiem tra LAI dieu kien (con focus khong/chieu cao co dung khong)
    // NGAY BEN TRONG forceRecalc() truoc khi lam bat cu gi - neu nguoi dung
    // da go tiep (focus lai) hoac ban phim da mo lai trong luc cho, HUY BO
    // ngay lap tuc. Ban truoc lam lai 6 lan lien tiep trong 1 giay MA KHONG
    // kiem tra lai dieu kien o moi lan, nen neu nguoi dung go/cham nhanh
    // trong khoang do se bi "rung" khung ve giua chung, ngat ban phim.
    (function () {
      if (!window.visualViewport) return;
      var vv = window.visualViewport;
      var fullHeight = window.innerHeight;
      var settleTimer = null;
      var _settleDelay = 400;

      function isInputFocused() {
        var active = document.activeElement;
        return !!(
          active &&
          (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')
        );
      }

      function forceRecalc() {
        // Kiem tra LAI ngay truoc khi dong vao gi - dieu kien co the da
        // khac di trong luc cho ON DINH.
        if (isInputFocused() || vv.height < fullHeight - 60) return;
        var glassPane = document.querySelector('flt-glass-pane');
        if (glassPane) {
          glassPane.style.width = 'calc(100% - 1px)';
          glassPane.style.height = 'calc(100% - 1px)';
          void glassPane.offsetHeight; // Ep reflow ngay lap tuc.
          window.dispatchEvent(new Event('resize'));
          requestAnimationFrame(function () {
            glassPane.style.width = '100%';
            glassPane.style.height = '100%';
            window.dispatchEvent(new Event('resize'));
          });
        }
        window.scrollTo(0, 0);
      }

      function scheduleRecalc() {
        if (settleTimer) clearTimeout(settleTimer);
        settleTimer = setTimeout(forceRecalc, _settleDelay);
      }

      function maybeRecalc() {
        // Chi coi la "ban phim da dong" khi CA 2 dieu kien: (a) chieu cao
        // hien tai gan bang chieu cao day du ghi nhan luc dau, VA (b) hien
        // KHONG co o INPUT/TEXTAREA nao dang giu focus.
        if (!isInputFocused() && vv.height >= fullHeight - 60) {
          scheduleRecalc();
        } else if (settleTimer) {
          // Dieu kien khong con dung (vd nguoi dung vua focus lai 1 o khac)
          // - huy lich cho dang cho, tranh forceRecalc chay tre vao dung
          // luc dang go.
          clearTimeout(settleTimer);
          settleTimer = null;
        }
      }

      vv.addEventListener('resize', maybeRecalc);
      // focusout: bat duoc NGAY thoi diem 1 o nhap mat focus (ca khi dong
      // ban phim bang cu chi back cua he thong, xem flutter/flutter#179438),
      // khong can doi visualViewport bao ve sau (co the tre/khong on dinh).
      window.addEventListener(
        'focusout',
        function () {
          setTimeout(maybeRecalc, 300);
        },
        true
      );
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

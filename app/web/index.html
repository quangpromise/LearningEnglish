<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <!--
    Sau 3 lan va (o day tung co 1 <script> dung window.visualViewport +
    "rung" flt-glass-pane de vam viec ban phim dong xong man hinh bi ket kich
    thuoc nho tren web mobile - xem flutter/flutter#175074/#179438) MA lan
    nao cung keo theo it nhat 1 loi moi (khong mo duoc ban phim, ngat ban
    phim khi go nhanh) roi van khong het han duoc trieu chung goc, doi huong
    hoan toan: bo het script vam do, VA doi "interactive-widget" tu
    "resizes-content" (chinh gia tri nay - CHINH LOP MO O DAY LAN DAU - lam
    TRINH DUYET tu co RESIZE LUON CA LOP LAYOUT, khong chi lop hien thi, khi
    ban phim mo, day moi la nguon goc that su khien no de "ket" khi dong lai)
    sang "resizes-visual" (mac dinh cua da so trinh duyet, CHI lop hien thi
    (visualViewport) thay doi, lop layout giu nguyen kich thuoc goc xuyen
    suot) - Flutter engine ban 3.47+ (xem flutter/flutter#179581, da vao
    stable tu thang 1/2026) DA TU SUA dung phan viewInsets tu chinh lech
    layout/visual nay, KHONG can them script rieng nua trong che do
    resizes-visual.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

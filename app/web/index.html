<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Học tiếng Anh qua âm nhạc - nghe nhạc, tra từ, luyện phát âm.">
  <!--
    KHONG dat <meta name="viewport"> o day: engine Flutter Web tu XOA moi
    the viewport co san va thay bang the cua no luc khoi dong (xem
    full_page_embedding_strategy.dart _applyViewportMeta trong SDK) - cac
    lan truoc doi interactive-widget o day deu KHONG co tac dung gi.
  -->
  <script>
    // Va bug engine Flutter Web tren Android Chrome (flutter/flutter#179438):
    // dong ban phim xong, man hinh van "co" (viewInsets/physicalSize bi ket
    // gia tri cu) vi engine CHI tinh lai kich thuoc khi nhan su kien 'resize'
    // tren window.visualViewport (xem full_page_dimensions_provider.dart) -
    // ma su kien that doi khi den luc chieu cao con chua cap nhat xong, sau
    // do khong co su kien nao nua.
    //
    // Cach va: sau khi moi thu da on dinh, PHAT LAI 1 su kien 'resize' gia
    // tren CHINH window.visualViewport - engine se doc lai chieu cao THUC TE
    // luc do va tinh lai dung. Tuong duong trinh duyet ban them 1 su kien
    // resize nua: KHONG blur, KHONG scroll, KHONG sua style DOM nao (cac ban
    // va truoc lam 3 viec do nen gay loi khong mo duoc/tu ngat ban phim, va
    // con phat su kien tren window - engine khong he nghe window nen vo tac
    // dung).
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var timer = null;
      function nudge() {
        timer = null;
        vv.dispatchEvent(new Event('resize'));
      }
      function schedule() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(nudge, 350);
      }
      // Chi phan ung voi su kien THAT (isTrusted) - su kien gia do chinh
      // nudge() phat ra khong duoc kich hoat lai vong lap.
      vv.addEventListener('resize', function (e) {
        if (e.isTrusted) schedule();
      });
      // O nhap mat focus (bam ra ngoai, bam Done, dong popup, back ra
      // ngoai...) - ban phim dang/sap dong, cho on dinh roi tinh lai.
      window.addEventListener('focusout', schedule, true);
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GymTalk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GymTalk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Tat incremental compilation: nhieu plugin (speech_to_text, flutter_tts) build
# loi tren Windows khi project (o D:) va pub-cache (o C:) khac drive root, do
# Kotlin build-tools-api tinh relative path giua 2 file khac root se throw.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# agora_rtc_engine (SDK goi thoai/video) keo theo ~20 file .aar tinh nang tuy
# chon (chong on, lam dep hinh, phat hien khuon mat...) va TAT CA deu khai bao
# chung 1 namespace Android "io.agora.rtc" - thiet ke cua Agora, khong sua duoc
# vi la thu vien dong tai qua Maven. Ha ca lieu (NON_FATAL) de manifest merger
# chi canh bao thay vi lam build that bai - can dung kem AGP < 9.0 (xem
# settings.gradle.kts) vi co nay bi AGP 9 bo qua hoan toan.
android.packageNamespacingViolationRestriction=NON_FATAL

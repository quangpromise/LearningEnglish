org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Tat incremental compilation: nhieu plugin (speech_to_text, flutter_tts) build
# loi tren Windows khi project (o D:) va pub-cache (o C:) khac drive root, do
# Kotlin build-tools-api tinh relative path giua 2 file khac root se throw.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Flutter Gradle plugin mac dinh dat abiFilters = armeabi-v7a, arm64-v8a, x86_64
# o defaultConfig (bat ke --target-platform), khien .so x86_64 cua plugin lot vao
# APK release (~11MB, build #466). Tat de abiFilters cua ban release trong
# app/build.gradle.kts (chi ARM) la bo loc duy nhat; ban debug khong loc.
disable-abi-filtering=true
